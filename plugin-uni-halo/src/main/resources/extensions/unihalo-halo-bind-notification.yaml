apiVersion: notification.halo.run/v1alpha1
kind: ReasonType
metadata:
  name: unihalo-halo-bind-code
spec:
  displayName: "UniHalo Halo 账号绑定验证码"
  description: "微信小程序绑定 Halo 账号时发送邮箱验证码。"
  properties:
    - name: code
      type: string
      description: "6 位数字验证码"
    - name: expirationAtMinutes
      type: integer
      description: "验证码有效分钟数"
    - name: username
      type: string
      description: "Halo 用户名"
---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-unihalo-halo-bind-code
spec:
  reasonSelector:
    reasonType: unihalo-halo-bind-code
    language: default
  template:
    title: "Halo 账号绑定验证码-[(${site.title})]"
    rawBody: |
      【[(${site.title})]】您正在绑定 Halo 账号，验证码为：[(${code})]，请在 [(${expirationAtMinutes})] 分钟内完成验证。如非本人操作请忽略。
    htmlBody: |
      <div class="notification-content">
        <div class="head">
          <p class="honorific" th:text="|${username} 你好：|"></p>
        </div>
        <div class="body">
          <p>您正在绑定 Halo 账号，请使用下面的验证码完成验证。</p>
          <div class="verify-code" style="font-size:24px;line-height:24px;color:#333;">
            <b th:text="${code}"></b>
          </div>
          <p th:text="|验证码 ${expirationAtMinutes} 分钟内有效。|"></p>
          <p>如非本人操作请忽略此邮件。</p>
        </div>
      </div>
