                  label: 单次积分
                  value: 10
                  min: 0
                - $formkit: number
                  name: dailyMaxCount
                  label: 每日最多次数
                  value: 10
                  min: 0
                - $formkit: number
                  name: dailyMaxPoints
                  label: 每日积分上限
                  value: 100
                  min: 0
