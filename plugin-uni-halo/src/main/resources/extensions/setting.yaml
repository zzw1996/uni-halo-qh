apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-uni-halo-settings
spec:
  forms:
    - group: basicConfig
      label: 基本配置
      formSchema:
        - $formkit: group
          name: tokenConfig
          label: Token配置
          help: 说明：配置小程序需要用到的token。
          value:
            personalToken: ""
          children:
            - $el: div
              attrs:
                class: "formkit-help text-xs mt-2 text-gray-500 flex items-center mb-1 cursor-pointer"
              innerHTML: "个人令牌：用于请求，发布瞬间，图库等操作（systemToken），参考 Token配置 。"
            - $formkit: textarea
              name: personalToken
              label: 个人令牌
              value: ""
              validation: required
        - $formkit: radio
          name: auditModeEnabled
          id: auditModeEnabled
          label: 是否开启审核模式
          help: 开启审核模式，关闭小程序部分数据展示，小程序提交审核使建议开启，审核后关闭。
          value: false
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
          validation: required
        - $formkit: text
          if: "$get(auditModeEnabled).value === true"
          name: auditModeMockUrl
          label: 模拟数据地址
          value: ""
          validation: required
          help: "填写模拟数据的url地址，参考数据格式和说明：https://uni-halo.925i.cn/deploy/wx-release.html"
        - $formkit: group
          name: copyrightConfig
          label: 页面版权配置
          value:
            enabled: true
            content: "「 2022 uni-halo 丨 开源项目@小莫唐尼 」"
          help: 说明：是否显示页面底部的版权信息（uni-halo 版权），只在【关于】页面中。
          children:
            - $formkit: select
              name: enabled
              id: copyrightEnabled
              label: 显示版权信息
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              validation: required
            - $formkit: text
              if: "$get(copyrightEnabled).value === true"
              name: content
              label: 版权内容
              value: ""
              validation: required
        - $formkit: group
          name: postDetailConfig
          label: 文章详情页配置
          value:
            showComment: true
            copyrightEnabled: true
            copyrightAuthor: "uni-halo"
            copyrightDesc: "使用《非商业性使用-相同方式共享 4.0 国际 (CC BY-NC-SA 4.0)》协议授权，文章来源于网上收集或者原创，若未在文章内说明的均为原创文章"
            copyrightViolation: "若侵害到您的权利，请您及时联系我，在收到通知后第一时间处理，邮箱：xxxx@xx.com"
          children:
            - $formkit: select
              name: showComment
              label: 是否显示评论相关
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              validation: required
              help: 说明：直接关闭评论区（不显示数据）和评论按钮，优先级高于系统设置的评论开关。
            - $formkit: select
              name: copyrightEnabled
              id: postDetailCopyrightEnabled
              label: 是否使用文章版权
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              validation: required
              help: 说明：文章详情页面中，显示关于文章版权相关的说明信息。
            - $formkit: text
              if: "$get(postDetailCopyrightEnabled).value === true"
              name: copyrightAuthor
              label: 文章版权作者
              value: ""
              validation: required
            - $formkit: text
              if: "$get(postDetailCopyrightEnabled).value === true"
              name: copyrightDesc
              label: 文章版权描述
              value: ""
              validation: required
            - $formkit: text
              if: "$get(postDetailCopyrightEnabled).value === true"
              name: copyrightViolation
              label: 文章侵权说明
              value: ""
              validation: required
        - $formkit: select
          name: showAboutSystem
          label: 显示关于项目页面
          value: true
          options:
            - label: 是
              value: true
            - label: 否
              value: false
          validation: required
          help: 说明：该页面入口在【关于】导航页面的【关于项目】入口，主要用于介绍该开源项目。
        - $formkit: group
          name: disclaimers
          label: 免责声明
          value:
            enabled: true
            content: ""
          children:
            - $formkit: select
              name: enabled
              id: disclaimersEnabled
              label: 是否启用
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              validation: required
            - $formkit: code
              name: content
              label: 声明内容
              value: ""
              language: html
              height: 200px
              help: 免责声明页面内容，不填写的话使用默认模板，支持 html 语法。
        - $formkit: group
          name: notifyConfig
          label: 活动公告弹窗
          value:
            enabled: false
            title: ""
            content: ""
            url: ""
          help: 开启后首页启动时弹出一次公告（每天最多弹一次）；可用于活动预告、新功能上线通知。
          children:
            - $formkit: switch
              name: enabled
              label: 开启公告弹窗
              value: false
              onValue: true
              offValue: false
            - $formkit: text
              name: title
              label: 公告标题
              value: ""
              validation: required
            - $formkit: textarea
              name: content
              label: 公告内容
              value: ""
              help: 支持 Markdown 语法。
            - $formkit: text
              name: url
              label: 跳转链接（可选）
              value: ""
              help: 填写后弹窗底部显示「点击跳转内容链接」按钮（以网页形式打开）。
    - group: redisConfig
      label: 验证码 Redis 配置
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "Halo Pro 2.16+ 可在主程序启用 Redis，但插件隔离上下文通常无法注入 RedisConnectionFactory。社区版或未注入 Bean 时，请在此配置插件独立 Redis；也可选内存模式（仅单节点开发）。"
        - $formkit: select
          name: storageMode
          label: 验证码存储方式
          value: auto
          options:
            - label: 自动（Halo Redis → 插件 Redis → 内存）
              value: auto
            - label: 仅 Halo 内置 Redis
              value: halo
            - label: 插件独立 Redis
              value: plugin-redis
            - label: 内存（重启失效，仅单节点）
              value: memory
          validation: required
        - $formkit: group
          name: pluginRedis
          label: 插件 Redis 连接
          value:
            enabled: false
            host: ""
            port: 6379
            database: 0
            password: ""
            username: ""
          help: storageMode 为 plugin-redis 时必填；auto 模式下填写后可作为 Halo Redis 不可用时的回退。
          children:
            - $formkit: select
              name: enabled
              id: pluginRedisEnabled
              label: 启用插件 Redis
              value: false
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
            - $formkit: text
              if: "$get(pluginRedisEnabled).value === true"
              name: host
              label: Redis 地址
              value: ""
              help: 例如 redis 或 127.0.0.1
            - $formkit: number
              if: "$get(pluginRedisEnabled).value === true"
              name: port
              label: 端口
              value: 6379
              min: 1
              max: 65535
            - $formkit: number
              if: "$get(pluginRedisEnabled).value === true"
              name: database
              label: 数据库
              value: 0
              min: 0
            - $formkit: text
              if: "$get(pluginRedisEnabled).value === true"
              name: username
              label: 用户名（可选）
              value: ""
            - $formkit: password
              if: "$get(pluginRedisEnabled).value === true"
              name: password
              label: 密码（可选）
              value: ""
    - group: appConfig
      label: 应用配置
      formSchema:
        - $formkit: group
          name: appInfo
          label: 应用信息
          value:
            name: "uni-halo v2.0"
            logo: "https://uni-halo.925i.cn/uni_halo/uni_halo_logo.png"
            qrCodeImageUrl: "https://uni-halo.925i.cn/uni_halo/uni_halo_qq_qrcode.png"
          children:
            - $formkit: text
              name: name
              label: 应用名称
              value: "uni-halo v2.0"
              validation: required
            - $formkit: attachment
              name: logo
              label: 应用图标
              value: "https://uni-halo.925i.cn/uni_halo/uni_halo_logo.png"
              validation: required
            - $formkit: radio
              id: useDynamicQRCode
              name: useDynamicQRCode
              label: 是否启用动态小程序码
              value: false
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              help: 启用后，生成的海报将显示动态的小程序码，实现扫描海报跳转文章详情页。
            - $formkit: text
              if: "$get(useDynamicQRCode).value === true"
              name: appId
              key: appId
              label: 小程序APP_ID
              value: ""
              validation: required
              help: 小程序的APP_ID，到微信公众平台获取
            - $formkit: text
              if: "$get(useDynamicQRCode).value === true"
              name: appSecret
              key: appSecret
              label: 小程序APP_SECRET
              value: ""
              validation: required
              help: 小程序的APP_SECRET，到微信公众平台获取
            - $formkit: attachmentPolicySelect
              if: "$get(useDynamicQRCode).value === true"
              name: policyName
              key: policyName
              label: 存储策略
              help: 存储策略
              value: "default-policy"
              validation: required
            - $formkit: attachmentGroupSelect
              if: "$get(useDynamicQRCode).value === true"
              name: fileGroupName
              key: fileGroupName
              label: 附件分组
              help: 附件分组
              value: ""
            - $formkit: attachment
              if: "$get(useDynamicQRCode).value === false"
              name: qrCodeImageUrl
              key: qrCodeImageUrl
              label: 小程序码图片
              value: "https://uni-halo.925i.cn/uni_halo/uni_halo_qq_qrcode.png"
              validation: required
              help: 微信小程序二维码的图片地址，用于海报生成
        - $formkit: group
          name: startConfig
          label: 启动页配置
          value:
            enabled: true
            alwaysShow: true
            title: "uni-halo 2.0"
            titleStyle: "color:#ffffff;"
            bg: "bg-gradient-blue-lighten-b"
            bgImage: ""
            bgVideo: ""
            backgroundType: "color"
            logo: "https://uni-halo.925i.cn/uni_halo/uni_halo_logo.png"
            desc1: "新触动 新感受 新体验"
            desc2: "准备好了吗，即刻就出发"
            descStyle: "color:#ffffff;"
            btnText: "立即体验"
            btnClass: ""
            btnStyle: ""
            useWave: true
          children:
            - $formkit: select
              name: enabled
              id: startConfigEnabled
              label: 开启启动页面
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              help: 使用启动页面后，用户访问应用时将优先显示启动页面
            - $formkit: select
              if: "$get(startConfigEnabled).value === true"
              name: alwaysShow
              label: 启动显示频率
              value: true
              options:
                - label: 每次显示
                  value: true
                - label: 显示一次
                  value: false
              help: 是否每次打开应用时都显示启动页面
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: title
              label: 启动标题
              value: "uni-halo 2.0"
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: titleStyle
              label: 标题样式
              value: "color:#ffffff;"
              help: 用于自定义样式，标准的css样式写法
            - $formkit: select
              if: "$get(startConfigEnabled).value === true"
              name: backgroundType
              id: backgroundTypeId
              label: 背景类型
              value: "color"
              options:
                - label: 颜色
                  value: "color"
                - label: 视频
                  value: "video"
                - label: 图片
                  value: "image"
              help: 使用视频背景后，启动页面将显示视频背景，视频背景的宽高比推荐为 9:16
            - $formkit: text
              if: "$get(startConfigEnabled).value === true && $get(backgroundTypeId).value === 'color'"
              key: bg
              name: bg
              label: 背景颜色类名
              value: "bg-gradient-blue-lighten-b"
              help: 背景颜色类名（仅支持组件内部样式类），用于自定义背景颜色
            - $formkit: attachment
              if: "$get(startConfigEnabled).value === true && $get(backgroundTypeId).value === 'image'"
              key: bgImage
              name: bgImage
              label: 背景图片地址
              value: ""
              help: 背景图片地址，支持网络图片地址
            - $formkit: select
              if: "$get(startConfigEnabled).value === true && $get(backgroundTypeId).value === 'image'"
              key: bgImageFit
              name: bgImageFit
              label: 图片裁剪模式
              value: "cover"
              options:
                - label: 100%
                  value: "100% 100%"
                - label: fill
                  value: "initial"
                - label: cover
                  value: "cover"
                - label: contain
                  value: "contain"
            - $formkit: attachment
              if: "$get(startConfigEnabled).value === true && $get(backgroundTypeId).value === 'video'"
              key: bgVideo
              name: bgVideo
              label: 背景视频地址
              value: ""
              help: 背景视频地址，支持网络图片地址，宽高比推荐为 9:16
            - $formkit: select
              if: "$get(startConfigEnabled).value === true && $get(backgroundTypeId).value === 'video'"
              key: bgVideoFit
              name: bgVideoFit
              label: 视频裁剪模式
              value: "cover"
              options:
                - label: cover
                  value: "cover"
                - label: fill
                  value: "fill"
                - label: contain
                  value: "contain"
            - $formkit: attachment
              if: "$get(startConfigEnabled).value === true"
              name: logo
              label: 启动图标
              value: "https://uni-halo.925i.cn/uni_halo/uni_halo_logo.png"
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: desc1
              label: 文本1
              value: "新触动 新感受 新体验"
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: desc2
              label: 文本2
              value: "准备好了吗，即刻就出发"
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: descStyle
              label: 文本样式
              value: "color:#ffffff;"
              help: 用于自定义样式，标准的css样式写法
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              validation: required
              name: btnText
              label: 按钮文本
              value: "立即体验"
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: btnClass
              label: 按钮类名
              value: ""
              help: 按钮类名（仅支持组件内部样式类），用于自定义按钮样式
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: btnStyle
              label: 按钮样式
              value: "color:#ffffff;"
              help: 用于自定义样式，标准的css样式写法
            - $formkit: select
              if: "$get(startConfigEnabled).value === true"
              name: useWave
              label: 启用波浪效果
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              help: 底部的波浪效果
          help: 配置项中，提到的内置 类样式 相关的内容，请查阅 https://uni-halo.925i.cn/ 相关文档
    - group: imagesConfig
      label: 图片配置
      formSchema:
        - $formkit: attachment
          name: defaultImageUrl
          label: 默认图片
          value: "https://api.7trees.cn/img"
          validation: required
          help: 默认图片，当图片加载失败或者无图的时候显示，支持静态图片和随机图api
        - $formkit: attachment
          name: defaultThumbnailUrl
          label: 文章默认封面
          value: "https://tenapi.cn/v2/acg"
          validation: required
          help: 文章默认封面图片，支持静态图片和随机图api
        - $formkit: attachment
          name: defaultStaticThumbnailUrl
          label: 文章默认静态封面
          value: ""
          validation: required
          help: 文章默认封面图片，只支持静态图片
        - $formkit: attachment
          name: defaultAvatarUrl
          label: 默认头像地址
          value: "https://api.qjqq.cn/api/MiYouShe"
          validation: required
          help: 默认头像地址，用于评论/文章作者无头像显示，支持静态图片和随机图api
        - $formkit: attachment
          name: loadingGifUrl
          label: 加载中的图片
          value: "https://uni-halo.925i.cn/uni_halo/uni_halo_img_lazyload.gif"
          validation: required
          help: 图片正在加载中的图片资源，请选择较小的gif图片
        - $formkit: attachment
          name: loadingErrUrl
          label: 加载失败图片
          value: "https://uni-halo.925i.cn/uni_halo/3gVrtNeEDFeuMK14Vtytb9ml73TZj3dX.gif"
          validation: required
          help: 图片资源加载失败后显示的图片，请选择较小的图片
        - $formkit: attachment
          name: loadingEmptyUrl
          label: 空图片
          value: ""
          help: 图片资源为空时显示的图片，请选择较小的图片
    - group: shareConfig
      label: 分享配置
      formSchema:
        - $formkit: text
          name: title
          label: 标题
          value: "uni-halo 2.0"
          validation: required
        - $formkit: text
          name: desc
          label: 描述
          value: "一款免费开源可多端编译的微信小程序博客应用。"
          validation: required
        - $formkit: attachment
          name: imageUrl
          label: 封面
          value: "https://uni-halo.925i.cn/logo.png"
          validation: required
        - $formkit: text
          name: path
          label: 页面路径
          value: "/pages/index/index"
          validation: required
          help: 页面路径，如：/pages/index/index（一般默认就行）
        - $formkit: text
          name: copyLink
          label: 复制链接
          value: "/pages/index/index"
          validation: required
          help: 复制链接，如：/pages/index/index（一般默认就行）
    - group: wxAppConfig
      label: 微信小程序
      formSchema:
        - $formkit: text
          name: appId
          label: 小程序 AppID
          value: ""
          help: 到微信公众平台获取小程序 AppID；若已在「应用配置」中填写，可与此处保持一致
        - $formkit: text
          name: appSecret
          label: 小程序 AppSecret
          value: ""
          help: 到微信公众平台获取小程序 AppSecret，仅保存在服务端
        - $formkit: select
          name: loginEnabled
          label: 是否开启登录
          value: true
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
          validation: required
        - $formkit: number
          name: profileModifyLimit
          label: 资料修改次数上限
          value: 0
          min: 0
          help: 0 表示不限制；大于 0 时用户通过 updateProfile 修改资料的次数上限（首次登录完善资料不计入）
        - $formkit: switch
          name: haloBindEnabled
          label: 开启 Halo 账号关联
          value: false
          onValue: true
          offValue: false
          help: 开启后，小程序将展示 Halo 账号关联入口及登录后的绑定引导；关闭后隐藏相关功能
    - group: channelsConfig
      label: 视频号
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "开启后，小程序首页会展示一张视频号入口卡片，用户点击直接跳转到你的视频号主页。跳转用微信开放能力 wx.openChannelsUserProfile 实现，需基础库 2.21.2 及以上，且只能在微信小程序内生效；H5 / App 端会自动降级为「复制视频号 ID + 微信内搜索」的引导。"
        - $formkit: switch
          name: enabled
          id: channelsEnabled
          label: 开启首页视频号入口
          value: false
          onValue: true
          offValue: false
          help: 关闭时小程序首页不展示视频号卡片（其余配置保留，重新开启即可复用）。
        - $formkit: text
          if: "$get(channelsEnabled).value === true"
          name: finderUserName
          label: 视频号 ID（finderUserName）
          value: ""
          validation: required
          help: "形如 sphcqO59YEPCvoe，必须以 sph 开头。获取方式：微信 → 我 → 视频号 → 进入我的视频号 → 右上角「…」→ 点一下视频号名字进入资料页，等 1~2 秒即可看到视频号 ID；或登录「视频号助手」在首页查看。填错会导致点击后无法跳转。"
        - $formkit: text
          if: "$get(channelsEnabled).value === true"
          name: nickname
          label: 视频号名称
          value: ""
          validation: required
          help: 展示在卡片标题上，一般与视频号昵称保持一致，例如：小莫唐尼
        - $formkit: textarea
          if: "$get(channelsEnabled).value === true"
          name: desc
          label: 简介
          value: ""
          help: 一句话说明视频号里会更新什么内容，建议不超过 30 字，超出会在卡片上截断。
        - $formkit: attachment
          if: "$get(channelsEnabled).value === true"
          name: avatarUrl
          label: 视频号头像
          value: ""
          help: 建议正方形图片（视频号头像 / logo）。留空时卡片用名称首字做兜底头像。
        - $formkit: text
          name: buttonText
          label: 按钮文案
          value: "进入视频号"
          help: 卡片按钮上的文字，留空则用「进入视频号」。
        - $formkit: text
          name: tip
          label: 底部提示
          value: "微信内点开即可观看，关注不迷路"
          help: 卡片底部的一行小字，留空则不展示。
    - group: tabbarConfig
      label: 底部导航（TabBar）
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "小程序底部导航默认是「首页 / 发现 / 瞬间 / 榜单 / 我的」5 项，由微信原生渲染。微信原生底栏不支持运行时增删项，所以开启本组配置后，小程序会隐藏原生底栏并改用自绘底栏，这样就能按开关决定显示哪几项。显示数量限制在 3~5 项（微信原生底栏最多 5 项；最少 3 项是本站口径）：不足 3 项会按「分类 → 瞬间 → 榜单 → 图库 → 小店」补齐，超过 5 项会按相反顺序裁掉。首页与「我的」是固定项，不提供开关。关闭本组开关时行为与现在完全一致，可随时回退。"
        - $formkit: switch
          name: enabled
          id: tabbarEnabled
          label: 启用可配置底部导航
          value: false
          onValue: true
          offValue: false
          help: 关闭（默认）= 沿用微信原生底栏，本次配置全部不生效。
        - $formkit: switch
          if: "$get(tabbarEnabled).value === true"
          name: showCategory
          label: 显示「发现」
          value: true
          onValue: true
          offValue: false
        - $formkit: switch
          if: "$get(tabbarEnabled).value === true"
          name: showMoments
          label: 显示「瞬间」
          value: true
          onValue: true
          offValue: false
        - $formkit: switch
          if: "$get(tabbarEnabled).value === true"
          name: showRank
          label: 显示「榜单」
          value: true
          onValue: true
          offValue: false
        - $formkit: switch
          if: "$get(tabbarEnabled).value === true"
          name: showGallery
          label: 显示「图库」
          value: true
          onValue: true
          offValue: false
          help: 图库页此前没有任何入口，开启后才会出现在底部导航里。
        - $formkit: switch
          if: "$get(tabbarEnabled).value === true"
          name: showStore
          label: 显示「微信小店」
          value: false
          onValue: true
          offValue: false
          help: 开启后底部出现「小店」入口，点进去是内嵌的微信小店主页（可直接下单）。微信小店未开通时会展示开通指引页，详细配置见下方。
        - $formkit: group
          name: store
          label: 微信小店
          value:
            appId: ""
            name: ""
            desc: ""
            coverUrl: ""
            qrCodeUrl: ""
            guideUrl: ""
          help: 用微信官方「店铺卡」组件把微信小店主页嵌进小程序，用户无需跳转即可浏览商品与下单。需要基础库 3.5.5 及以上（低版本微信会降级为引导页），且不支持微信 Windows / Mac 版。
          children:
            - $formkit: text
              name: appId
              label: 微信小店ID
              value: ""
              help: "获取方式：微信小店后台 → 店铺管理 → 基础信息 → 账号信息 → 微信小店ID（形如 wx 开头）。填错或未开通时，小店页会展示开通指引。"
            - $formkit: text
              name: name
              label: 小店名称
              value: ""
              help: 底栏文案固定为「小店」，这里填的名称用于小店页标题与降级页展示。
            - $formkit: textarea
              name: desc
              label: 小店简介
              value: ""
              help: 降级页（微信版本过低 / 非微信端）展示的一句话说明。
            - $formkit: attachment
              name: coverUrl
              label: 小店封面 / 店铺卡图片
              value: ""
              help: 降级页展示，建议正方形或 16:9 图片。
            - $formkit: attachment
              name: qrCodeUrl
              label: 小店二维码 / 小程序码
              value: ""
              help: 降级页展示，方便用户扫码进店。
            - $formkit: text
              name: guideUrl
              label: 开通指引链接
              value: ""
              help: 可选。填了之后开通指引页会多一个「查看开通指引」按钮并打开该链接（H5 页面），留空则只展示内置的步骤文案。
    - group: userPublishConfig
      label: 用户投稿（积分兑换发布）
      formSchema:
        - $formkit: switch
          name: enabled
          label: 开启用户投稿
          value: false
          onValue: true
          offValue: false
          help: 开启后用户可用积分投稿文章、发布瞬间；关闭时后端一律拒绝（前端入口也随之隐藏）。发布走服务端，扣分与发布在同一请求内完成：先写幂等流水并扣分，发布失败会自动退还积分。
        - $formkit: switch
          name: showButton
          label: 显示发布入口
          value: true
          onValue: true
          offValue: false
          help: 总开关之外再加一层展示控制：关闭后小程序端不显示任何投稿入口（接口仍可被调用，但受 enabled 与积分门槛约束）。
        - $formkit: number
          name: minPointsToShow
          label: 显示门槛（积分达到该值才显示按钮，0=不限制）
          value: 0
          min: 0
          help: 只影响按钮是否显示，不消耗积分。未达标时小程序会提示「还差 X 积分」。注意门槛与发布价是两个独立概念：门槛决定「能不能看见入口」，发布价决定「发一次扣多少」。
        - $formkit: number
          name: articleCost
          label: 投稿文章消耗积分
          value: 50
          min: 0
        - $formkit: number
          name: momentCost
          label: 发布瞬间消耗积分
          value: 20
          min: 0
        - $formkit: select
          name: defaultRoleMode
          label: 未登记角色的默认发布方式
          value: draft
          options:
            - value: draft
              label: 待审（推荐，安全优先）
            - value: direct
              label: 直接发布
            - value: deny
              label: 不允许发布
          help: 角色未出现在下方策略表时的兜底。默认「待审」：站长新加的自定义角色不会因为没登记而被当成可信角色直接发布。
        - $formkit: repeater
          name: rolePolicies
          label: 按 Halo 角色控制发布方式
          value:
            - role: guest
              mode: deny
            - role: contributor
              mode: draft
            - role: author
              mode: direct
            - role: editor
              mode: direct
            - role: admin
              mode: direct
            - role: super-role
              mode: direct
          help: 命中哪个角色就用哪个角色的方式（一个用户有多个角色时按表内顺序取第一个命中的）。<b>direct=直接发布</b>（文章立即公开、瞬间立即可见）；<b>draft=待审</b>（文章落 Halo 草稿，站长在 Halo 后台「文章→草稿」审后发布；瞬间以 approved=false 提交，站长在瞬间管理里通过后才公开）；<b>deny=不允许</b>。内置角色标识：guest（访客）/ contributor（投稿者）/ author（作者）/ editor（编辑）/ admin（管理员）/ super-role（超级管理员）。默认的「投稿者走待审、其余直接发、访客不允许」即由此表决定，可随时改。
          children:
            - $formkit: text
              name: role
              label: Halo 角色标识（如 contributor、author；留空则忽略该行）
              value: ""
            - $formkit: select
              name: mode
              label: 发布方式
              value: draft
              options:
                - value: direct
                  label: 直接发布
                - value: draft
                  label: 待审
                - value: deny
                  label: 不允许
        - $formkit: switch
          name: requireHaloBind
          label: 必须关联 Halo 账号才能投稿
          value: true
          onValue: true
          offValue: false
          help: 关闭后未关联 Halo 账号的用户也不能发布（没有 Halo 用户就没有作者身份），此项只影响错误提示文案，建议保持开启。
        - $formkit: switch
          name: contentSecurityEnabled
          label: 开启微信内容安全检测
          value: true
          onValue: true
          offValue: false
          help: 对投稿文本调用微信 msgSecCheck（图片检测未接入）。违规内容直接拒绝发布；检测接口本身不可用（网络/令牌问题）时放行并在日志告警，避免微信侧抖动把发布链路卡死。
        - $formkit: number
          name: dailyArticleLimit
          label: 每人每日投稿文章上限（0=不限）
          value: 3
          min: 0
        - $formkit: number
          name: dailyMomentLimit
          label: 每人每日发布瞬间上限（0=不限）
          value: 5
          min: 0
        - $formkit: number
          name: maxArticleTitleLength
          label: 文章标题字数上限
          value: 60
          min: 1
        - $formkit: number
          name: maxArticleContentLength
          label: 文章正文字数上限
          value: 5000
          min: 100
        - $formkit: number
          name: maxMomentLength
          label: 瞬间文字字数上限
          value: 500
          min: 1
        - $formkit: number
          name: maxMomentImages
          label: 瞬间图片张数上限
          value: 9
          min: 0
    - group: pointsConfig
      label: 积分系统
      formSchema:
        - $formkit: switch
          name: enabled
          label: 开启积分系统
          value: false
          onValue: true
          offValue: false
          help: 开启后，小程序用户可通过浏览、评论、点赞、签到等行为获得积分
        - $formkit: switch
          name: showInProfile
          label: 在个人中心展示
          value: true
          onValue: true
          offValue: false
          help: 关闭后「我的」页面不展示积分卡片（接口仍可用）
        - $formkit: number
          name: minBrowseDuration
          label: 浏览计分最短停留（秒）
          value: 5
          min: 1
          help: 前端文章详情页停留达到该秒数后才请求浏览积分
        - $formkit: group
          name: rules
          label: 积分规则
          value:
            browse:
              points: 1
              dailyMaxCount: 5
              dailyMaxPoints: 5
            comment:
              points: 5
              dailyMaxCount: 2
              dailyMaxPoints: 10
            upvote:
              points: 1
              dailyMaxCount: 5
              dailyMaxPoints: 5
            vote:
              points: 5
              dailyMaxCount: 2
              dailyMaxPoints: 10
            signIn:
              points: 5
              consecutiveBonus:
                - days: 3
                  bonus: 5
                - days: 7
                  bonus: 15
          children:
            - $formkit: group
              name: browse
              label: 浏览文章
              children:
                - $formkit: number
                  name: points
                  label: 单次积分
                  value: 1
                  min: 0
                  help: 推荐 1。浏览是最轻的行为，单价不宜高于评论。
                - $formkit: number
                  name: dailyMaxCount
                  label: 每日最多次数
                  value: 5
                  min: 0
                  help: 推荐 5（0 表示不限制次数）。原来默认 10 次太松：一天光浏览就白拿 10 分。
                - $formkit: number
                  name: dailyMaxPoints
                  label: 每日积分上限
                  value: 5
                  min: 0
                  help: 推荐 5（0 表示不限制）。浏览+点赞合计日封顶建议不超过 10 分——这两项无内容成本、最容易被刷。
            - $formkit: group
              name: comment
              label: 发表评论
              children:
                - $formkit: number
                  name: points
                  label: 单次积分
                  value: 5
                  min: 0
                  help: 推荐 5。评论有真实内容价值，单价可以高于浏览/点赞。
                - $formkit: number
                  name: dailyMaxCount
                  label: 每日最多次数
                  value: 2
                  min: 0
                  help: 推荐 2。评论容易被灌水，次数要收紧。
                - $formkit: number
                  name: dailyMaxPoints
                  label: 每日积分上限
                  value: 10
                  min: 0
                  help: 推荐 10。
            - $formkit: group
              name: upvote
              label: 点赞文章
              children:
                - $formkit: number
                  name: points
                  label: 单次积分
                  value: 1
                  min: 0
                  help: 推荐 1。点赞没有任何内容成本，是「刷分」的第一入口，单价必须压到最低。
                - $formkit: number
                  name: dailyMaxCount
                  label: 每日最多次数
                  value: 5
                  min: 0
                  help: 推荐 5（原来 20 次 = 一天白拿 40 分，会让用户觉得积分根本不值钱）。
                - $formkit: number
                  name: dailyMaxPoints
                  label: 每日积分上限
                  value: 5
                  min: 0
                  help: 推荐 5。
            - $formkit: group
              name: vote
              label: 参与投票
              children:
                - $formkit: number
                  name: points
                  label: 单次积分
                  value: 5
                  min: 0
                  help: 推荐 5。投票是运营活动（不是每天都有），单价可以略高，但日封顶要卡死。
                - $formkit: number
                  name: dailyMaxCount
                  label: 每日最多次数
                  value: 2
                  min: 0
                  help: 推荐 2。
                - $formkit: number
                  name: dailyMaxPoints
                  label: 每日积分上限
                  value: 10
                  min: 0
                  help: 推荐 10（原来 100 分/天 = 占全部日产出的一半，等于把积分白送）。
            - $formkit: group
              name: signIn
              label: 每日签到
              children:
                - $formkit: number
                  name: points
                  label: 基础签到积分
                  value: 5
                  min: 0
                  help: 推荐 5。签到是习惯养成，不应成为最重的收入来源（原来 10 分偏重）。
                - $formkit: repeater
                  name: consecutiveBonus
                  label: 连续签到奖励
                  value:
                    - days: 3
                      bonus: 5
                    - days: 7
                      bonus: 15
                  help: 连续签到达到指定天数时额外奖励（取满足条件的最高档）。推荐 3 天 +5、7 天 +15。
                  children:
                    - $formkit: number
                      name: days
                      label: 连续天数
                      value: 3
                      min: 2
                      validation: required
                    - $formkit: number
                      name: bonus
                      label: 额外奖励积分
                      value: 5
                      min: 1
                      validation: required
        - $formkit: group
          name: newUserGift
          label: 新用户见面礼
          value:
            points: 100
          help: 新用户首次登录自动到账的积分（每个用户永久限领一次）；填 0 表示关闭新人礼。
          children:
            - $formkit: number
              name: points
              label: 见面礼积分
              value: 100
              min: 0
              validation: required
    - group: dailyTaskConfig
      label: 每日任务
      formSchema:
        - $formkit: switch
          name: enabled
          label: 开启每日任务
          value: true
          onValue: true
          offValue: false
          help: 开启后，小程序用户可在任务中心查看并领取每日任务奖励（需同时开启积分系统）
        - $formkit: repeater
          name: tasks
          label: 任务列表
          value:
            - type: sign_in
              target: 1
              points: 5
              enabled: true
            - type: browse
              target: 3
              points: 5
              enabled: true
            - type: comment
              target: 1
              points: 5
              enabled: true
            - type: upvote
              target: 3
              points: 5
              enabled: true
            - type: vote
              target: 1
              points: 5
              enabled: true
          help: 同一任务的进度按「当日该行为的积分记录条数」统计，每天每任务可领取一次奖励。注意：若某行为在积分规则中的单次积分为 0，该行为不产生记录，对应任务进度将统计不到。
          children:
            - $formkit: select
              name: type
              label: 任务类型
              value: browse
              options:
                - value: sign_in
                  label: 每日签到
                - value: browse
                  label: 浏览文章
                - value: comment
                  label: 发表评论
                - value: upvote
                  label: 点赞
                - value: vote
                  label: 参与投票
              validation: required
            - $formkit: number
              name: target
              label: 每日目标次数
              value: 3
              min: 1
              validation: required
            - $formkit: number
              name: points
              label: 奖励积分
              value: 10
              min: 0
              help: 可为 0（表示只送阅读券不送积分）。「奖励积分」与「奖励阅读券」至少填一个，两者都为 0 的任务不会下发。
            - $formkit: number
              name: tickets
              label: 奖励阅读券张数
              value: 0
              min: 0
              help: 完成该任务额外赠送的阅读券张数，填 0 表示不送券。这是比「签到送券」更可控的赠券方式——按完成次数结算，力度天然受限，建议优先用它把券送给真正活跃的用户。
            - $formkit: switch
              name: enabled
              label: 启用该任务
              value: true
              onValue: true
              offValue: false
    - group: mallConfig
      label: 积分商城
      formSchema:
        - $formkit: repeater
          name: exchangeItems
          label: 兑换权益（积分免费兑换）
          value:
            - key: dashboard_advanced
              name: 数据看板高级版
              points: 100
              dailyMaxCount: 1
              description: 解锁当日数据看板高级版（30 日趋势与数据摘要导出）
            - key: content_ticket
              name: 阅读券 x1
              points: 150
              dailyMaxCount: 1
              tickets: 1
              description: 兑换 1 张阅读券，用于解锁付费文章
          help: 积分仅限站内权益兑换；key 唯一，功能页按 key 判断是否已开通。每日可兑次数受 dailyMaxCount 限制。<br /><b>阅读券</b>：key 填 content_ticket 即成为「用积分换券」的入口（发放张数由本项的「每次发放阅读券张数」或「阅读券获取 → 积分兑换每次发放张数」决定）。<b>删掉这一项也不会让券失去入口</b>：只要「付费内容」是开启的，插件会自动补一条内置的阅读券兑换项，定价取「阅读券获取 → 积分兑换默认定价」。
          children:
            - $formkit: text
              name: key
              label: 权益 key（唯一，小写字母/数字/下划线）
              value: ""
              validation: required
            - $formkit: text
              name: name
              label: 权益名称
              value: ""
              validation: required
            - $formkit: number
              name: points
              label: 兑换消耗积分
              value: 30
              min: 1
              validation: required
            - $formkit: number
              name: dailyMaxCount
              label: 每日可兑换次数
              value: 1
              min: 1
              validation: required
            - $formkit: textarea
              name: description
              label: 权益说明（前端展示）
              value: ""
            - $formkit: number
              name: tickets
              label: 每次发放阅读券张数（仅 key=content_ticket 时有效）
              value: 1
              min: 1
              help: 仅当「权益 key」填 content_ticket 时生效。留空或填 0 时会回落到「阅读券获取 → 积分兑换每次发放张数」。
    - group: levelConfig
      label: 等级与称号装扮
      formSchema:
        - $formkit: switch
          name: enabled
          label: 开启等级/称号/装扮
          value: true
          onValue: true
          offValue: false
          help: 开启后，小程序「身份中心」与「我的」页展示等级、称号；装扮需消耗积分兑换。
        - $formkit: repeater
          name: levels
          label: 等级表（按累计获得积分升级）
          value:
            - level: 1
              minPoints: 0
              title: 新手上路
            - level: 2
              minPoints: 100
              title: 初露锋芒
            - level: 3
              minPoints: 300
              title: 小有名气
            - level: 4
