            - $formkit: text
              name: title
              label: 等级名称
              value: ""
              validation: required
        - $formkit: repeater
          name: titles
          label: 称号（达标自动解锁，可佩戴展示）
          value:
            - id: read_100
              name: 百读不厌
              type: total_browse
              target: 100
              desc: 累计浏览 100 篇文章
            - id: sign_30
              name: 风雨无阻
              type: sign_in
              target: 30
              desc: 累计签到 30 天
            - id: vote_50
              name: 民意代表
              type: vote
              target: 50
              desc: 累计参与 50 次投票
            - id: comment_50
              name: 妙语连珠
              type: comment
              target: 50
              desc: 累计发表 50 条评论
            - id: invite_3
              name: 星火燎原
              type: invite
              target: 3
              desc: 邀请 3 位好友注册
            - id: points_5000
              name: 积分大亨
              type: total_points
              target: 5000
              desc: 累计获得 5000 积分
          children:
            - $formkit: text
              name: id
              label: 称号 ID（唯一，小写字母/数字/下划线）
              value: ""
              validation: required
            - $formkit: text
              name: name
              label: 称号名称
              value: ""
              validation: required
            - $formkit: select
              name: type
              label: 解锁条件类型
              value: total_browse
              options:
                - value: total_browse
                  label: 累计浏览篇数
                - value: sign_in
                  label: 累计签到天数
                - value: vote
                  label: 累计投票次数
                - value: comment
                  label: 累计评论条数
                - value: invite
                  label: 邀请注册人数
                - value: total_points
                  label: 累计获得积分
              validation: required
            - $formkit: number
              name: target
              label: 目标值
              value: 10
              min: 1
              validation: required
            - $formkit: text
              name: desc
              label: 达成说明（前端展示）
              value: ""
        - $formkit: repeater
          name: outfits
          label: 装扮商店（消耗积分兑换，0=永久）
          value:
            - key: avatar_gold
              name: 金色头像框
              type: avatar_frame
              points: 1200
              durationDays: 0
              style: gold
            - key: avatar_rainbow
              name: 彩虹头像框
              type: avatar_frame
              points: 3000
              durationDays: 0
              style: rainbow
            - key: nick_star
              name: 星光辉映
              type: nick_frame
              points: 600
              durationDays: 0
              style: "⭐"
            - key: nick_crown
              name: 王者之冠
              type: nick_frame
              points: 1800
              durationDays: 0
              style: "👑"
            - key: theme_dusk
              name: 静谧蓝紫主题
              type: theme
              points: 900
              durationDays: 0
              style: primary
            - key: theme_sunset
              name: 落日橙主题
              type: theme
              points: 900
              durationDays: 0
              style: deep-orange
          help: key 唯一；type 为 avatar_frame（头像框）/nick_frame（昵称前缀）/theme（全局主题皮肤）。style 含义随 type 不同：头像框填样式名（gold/rainbow/silver，需与前端注册表一致）、昵称前缀直接填前缀文本（如 ⭐、👑，建议 2 个字符以内，超长会被前端忽略）、theme 填<b>皮肤包 id 或框架主题名</b>。<br /><b>皮肤包（推荐）</b>：paper（宣纸白，默认，不改变外观）/ mint（青瓷：冷调页底 + 青绿强调）/ sunrise（晨光：暖调页底 + 琥珀强调）/ ink（墨韵深色：深墨底 + 亮字 + 亮靛青，夜间护眼）。皮肤会同时更换页面底色、卡片、文字层级、分割线、强调色与渐变，是「整体换装」；深色皮肤连导航栏与 tabBar 一起变暗。<br /><b>框架主题名（兼容旧配置）</b>：light-blue/primary/blue/cyan/green/orange/deep-orange/blue-grey，只换强调色，页面底色与卡片不变——已购用户的旧装扮继续有效。填错会导致用户付费后界面无变化（身份中心会显示「未登记」提示）。durationDays 填 0 表示永久；大于 0 为限时，到期后自动失效、需重新购买，身份中心会显示剩余天数。<br /><b>定价建议</b>：按「现金价（元）× 100」平价最稳妥——装饰品不影响付费墙，让愿意等的人慢慢攒、急着要的人直接买（默认 600/900/1200/1800/3000，对应现金 ￥6/9/12/18/30，中度活跃用户需攒 3 周~4 个月）。调低会让积分换装扮挤掉现金销量，调得过高则用户毫无盼头。
          children:
            - $formkit: text
              name: key
              label: 装扮 key（唯一，小写字母/数字/下划线）
              value: ""
              validation: required
            - $formkit: text
              name: name
              label: 装扮名称
              value: ""
              validation: required
            - $formkit: select
              name: type
              label: 装扮类型
              value: avatar_frame
              options:
                - value: avatar_frame
                  label: 头像框
                - value: nick_frame
                  label: 昵称前缀
                - value: theme
                  label: 主题色
              validation: required
            - $formkit: number
              name: points
              label: 兑换消耗积分
              value: 100
              min: 1
              validation: required
            - $formkit: number
              name: durationDays
              label: 有效天数（0=永久）
              value: 0
              min: 0
              validation: required
            - $formkit: text
              name: style
              label: 样式值（头像框 gold/rainbow/silver；昵称前缀填文本；主题填皮肤 id：paper/mint/sunrise/ink）
              value: ""
              help: 主题装扮填皮肤 id 会整站换装（页底/卡片/文字/分割线/强调色一起变）；也可填旧框架主题名只换强调色，两类取值都兼容。
            - $formkit: number
              name: minSpend
              label: 累计消费门槛（元，0=无门槛）
              value: 0
              min: 0
              help: 填 0 为普通装扮（谁都能用积分兑换）；大于 0 时该装扮变成「消费回馈限定款」——只有在本站累计消费达到该金额的用户才能兑换。这是消费里程碑的载体：用户为了凑门槛会主动多买，而限定装扮在评论区、榜单、我的页、身份中心都会展示，戴着它等于替站点做宣传。<br />注意单位为「元」，与「虚拟支付」里道具价格的「分」不同（填 30 就是消费满 30 元）。只统计已到账订单，待支付与需退款的不计。
    - group: inviteConfig
      label: 邀请奖励
      formSchema:
        - $formkit: switch
          name: enabled
          label: 开启邀请奖励
          value: true
          onValue: true
          offValue: false
          help: 开启后，用户可在「邀请好友」页生成邀请码，好友通过分享首次登录注册即视为邀请成功，邀请人获得奖励积分（同一被邀请人仅一次）。
        - $formkit: number
          name: rewardPoints
          label: 每邀请 1 人奖励积分（邀请人）
          value: 100
          min: 0
          validation: required
          help: 被邀请人注册后自动发放到邀请人账户；填 0 表示只给被邀请人发。推荐 100（约等于 1 元的购买力）：拉新价值高，给太少没人愿意分享；但也不宜超过 200，否则容易被批量小号刷。
        - $formkit: number
          name: inviteeRewardPoints
          label: 被邀请人奖励积分
          value: 50
          min: 0
          validation: required
          help: 新用户通过邀请分享首次登录时，他自己也能拿到的积分（填 0 表示不发）。这一笔与「新人见面礼」相互独立，两者都会发。注意：奖励只挂在「新用户首次注册」这个动作上，不要写成「分享得积分」——微信运营规范禁止诱导分享。
    - group: payConfig
      label: 虚拟支付（权益直购）
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "微信虚拟支付（个人主体）仅支持「道具直购」：现金直接购买具体权益（发布券 / 阅读券 / 装扮），不支持充值积分、代币等流转功能。数据看板高级版已调整为纯积分兑换权益，不再作为付费道具售卖。开通前提：小程序主体为个人、服务类目含「工具」、已完成认证与备案，并在 MP 后台【支付与交易 - 虚拟支付】开通签约。<b>MP 后台的「代币兑换比例」请设为 1 人民币 = 100 代币（1 代币 = 1 分），后台道具价格数值即本处分值，两边照抄不会错；该比例只在后台展示换算用，道具直购的实际扣款 = 本处分值 × 数量。</b>限额与费率：月支付限额 10 万元；Android 技术服务费约 1%、iOS 苹果佣金约 12%，iOS 单笔最低 1 元。"
        - $formkit: switch
          name: enabled
          id: payEnabled
          label: 开启权益直购
          value: false
          onValue: true
          offValue: false
          help: 关闭时小程序不展示「权益直购」入口、接口也不下发商品。请确认 MP 后台虚拟支付已开通并完成签约后再开启。
        - $formkit: text
          if: "$get(payEnabled).value === true"
          name: offerId
          label: OfferID（虚拟支付商户号）
          value: ""
          validation: required
          help: MP 后台【虚拟支付 - 基本配置】中的 OfferID；未填写时用户下单会提示「虚拟支付 OfferID 未配置」。
        - $formkit: password
          if: "$get(payEnabled).value === true"
          name: appKey
          label: 现网 AppKey（支付密钥）
          value: ""
          validation: required
          help: MP 后台【虚拟支付 - 基本配置】中的现网 AppKey，用于服务端计算 paySig 签名。仅保存在服务端、不会下发到小程序；填错会导致支付报 -15006。
        - $formkit: number
          if: "$get(payEnabled).value === true"
          name: env
          label: 支付环境
          value: 0
          min: 0
          max: 1
          help: 0 = 正式环境（现网），1 = 沙箱环境。小程序正式版只能填 0，填 1 会报 -15011。
        - $formkit: number
          if: "$get(payEnabled).value === true"
          name: zoneId
          label: 分区 ID（zoneId）
          value: 1
          min: 1
          help: 道具直购（short_series_goods）当前不使用该参数，保留默认值 1 即可。
        - $formkit: repeater
          if: "$get(payEnabled).value === true"
          name: goods
          label: 权益道具（现金直购商品）
          value:
            - goodsId: ""
              name: 阅读券 x5
              price: 600
              type: content_ticket
              value: 5
              style: ""
          help: 每个道具需先在 MP 后台【虚拟支付 - 道具管理】创建并完成发布（发布后约 10 分钟生效，未发布会报 -15010 / -15014）。道具 ID 与价格必须与微信后台完全一致，价格不一致会报 -15013。个人主体不支持「积分充值」类道具，即使配置了也不会下发到小程序。数据看板高级版与发布券均已下架，不再作为付费道具售卖，配置 dashboard 或 publish_ticket 类型同样不会下发。<br /><b>装扮类商品（type=outfit）的展示位置</b>：不再出现在小程序的「权益直购」页，而是作为「我的 → 身份中心 → 装扮商店」中该装扮的<b>现金价</b>，与积分价并列展示，用户可自行选择用积分兑换或直接付款；因此 style 仍必须填写装扮的 key（详见下方说明）。订单与退款清单（需管理员令牌）：{站点地址}/apis/api.uni.uhalo.pro/v1alpha1/plugins/plugin-uni-halo/refund-admin —— 用户重复购买已拥有的装扮时，订单会停在「待退款」状态且不会自动重试，需按该页的微信平台单号人工退款。
          children:
            - $formkit: text
              name: goodsId
              label: 道具 ID（productId）
              value: ""
              validation: required
              help: 需与 MP 后台【道具管理】中创建的道具 ID 完全一致，下单时作为 productId 传给微信。
            - $formkit: text
              name: name
              label: 道具名称（前端展示）
              value: ""
              validation: required
            - $formkit: attachment
              name: image
              label: 道具图片（可选，商品卡展示）
              value: ""
              accepts:
                - "image/*"
              help: 使用 Halo 官方附件选择器：可本地上传、也可从附件库挑选（支持「外部链接」类型的附件）。MP 后台【道具管理】里配的道具图片<b>不会下发给小程序</b>（微信没有读取接口），所以商品卡的图片以这里为准。本地存储的附件会自动拼上站点外链下发给小程序；图片所在域名需加入小程序后台的 downloadFile 合法域名（站点自己的域名通常已在）。建议 200×200 以上方图。
            - $formkit: number
              name: price
              label: 单价（单位：分）
              value: 600
              min: 1
              validation: required
              help: 单位为「分」，全程不做换算，例如 6 元填 600。必须与 MP 后台道具价格一致，否则支付报 -15013。<br /><b>MP 后台的代币兑换比例请设为「1 人民币 = 100 代币」（1 代币 = 1 分）</b>——这样后台道具的代币数值与本处分值是同一组数字（6 元 = 600 分 = 600 代币），两边照抄即可。比例设成其它值（如 1:1）时后台会按 代币数 × (1元 ÷ 比例) 收款，600 代币就会变成收 600 元。注意比例一旦发布不可修改；iOS 端单笔最低支付 1 元（低于 1 元的道具在 iOS 无法购买）。
            - $formkit: select
              name: type
              label: 道具类型
              value: content_ticket
              options:
                - value: content_ticket
                  label: 阅读券（解锁付费文章）
                - value: outfit
                  label: 装扮（在身份中心穿戴）
                - value: membership
                  label: 会员卡（单次购买的有效期权益）
                - value: ai_content
                  label: AI 定制内容（用户自配偏好，每日简报）
                - value: bundle
                  label: 套餐（一条商品含多种权益）
              validation: required
              help: 仅限以上权益直购类型，不支持积分充值。数据看板高级版已改为纯积分兑换权益（见「积分商城」分组）；发布券已下架——普通用户当前不能发表瞬间（仅博主可发），该券没有消费点，卖出去用户也用不上，故不再作为付费道具售卖；类型非法或缺失的商品不会下发。<br /><b>membership</b>：需先在「会员卡」分组开启会员，道具数量填天数（会员期内付费文章免券）。<br /><b>ai_content</b>：需先在「AI 定制内容」分组开启该功能，道具数量填有效天数（<b>填 0 = 永久买断</b>）。购买后用户可在小程序里自行勾选主题分类/来源/关键词，服务端据此从已生成的日报内容里筛出他的每日简报。<br /><b>bundle</b>：在下方「套餐子项」里配置包含的权益，子项会逐个发放；套餐里的装扮子项与单卖装扮走同一套校验（未登记或已拥有都会拒绝下单，避免付了套餐钱却产生退款纠纷）。
            - $formkit: number
              name: value
              label: 道具数量
              value: 1
              min: 1
              help: 阅读券 = 发放的券张数（如买 5 张填 5）；会员卡 = 会员天数；AI 定制内容 = 有效天数（0 = 永久）；装扮保持 1 即可。某条商品配了「套餐子项」时会忽略本字段（以子项配置为准）。
            - $formkit: repeater
              name: items
              label: 套餐子项（仅类型为「套餐」时填写）
              value: []
              help: 仅当道具类型选「套餐」时生效。每个子项是一项权益，发货时按顺序逐个发放，各自独立幂等（中途失败重试不会重复发放已成功的子项）。<b>子项里的装扮必须填装扮 key</b>，且用户已拥有该装扮时会拒绝整单下单——避免用户付了套餐钱、装扮那部分变成退款纠纷。同一装扮在一份套餐里不要重复配置。注意：套餐子项不支持嵌套套餐，也不支持积分充值。
              children:
                - $formkit: select
                  name: type
                  label: 权益类型
                  value: content_ticket
                  options:
                    - value: content_ticket
                      label: 阅读券
                    - value: outfit
                      label: 装扮
                    - value: membership
                      label: 会员天数
                  validation: required
                - $formkit: number
                  name: value
                  label: 数量（券张数 / 会员天数）
                  value: 1
                  min: 1
                  help: 装扮子项固定为 1，填其他值会被忽略。
                - $formkit: text
                  name: style
                  label: 装扮 key（子项为装扮时必填）
                  value: ""
                  help: 填装扮商店里的 key（如 avatar_gold），不是样式值。
            - $formkit: number
              name: originalPrice
              label: 划线原价（单位：分，可留空）
              value: 0
              min: 0
              help: 仅用于促销展示（例如现价 600 分、原价 3000 分，界面显示「￥30.0 <s>￥6.0</s>」）。<b>不参与任何计算</b>：实际售价始终是上面的「单价」，必须与 MP 后台一致。原价必须高于现价，否则会被忽略（避免出现「现价 6 元、原价 5 元」这种明显错误）。请填真实的历史价格，虚构原价违反价格标示要求。
            - $formkit: datetime-local
              name: promoEndsAt
              label: 限时截止时间（可留空）
              value: ""
              help: 直接点选日期与时间即可（按你所在时区理解，无需换算时间戳）。填写后小程序会显示「限时特价」标记与倒计时，到期自动隐藏划线价与倒计时。<br /><b>留空 = 没有活动。</b>只填日期不填时间时按当天 23:59 截止。注意：这里只影响「划线原价 + 倒计时」的展示，<b>实际售价始终是上面的「单价」</b>——真的要调价，必须去 MP 后台改道具价格（微信侧优惠价最低只能到原价的 40%）。
            - $formkit: text
              name: style
              label: 装扮 key（类型为装扮时必填）
              value: ""
              help: 必须填写「等级与称号装扮 → 装扮商店」中对应装扮的 key（如 avatar_gold、nick_star、theme_dusk），不是样式值（如 gold、⭐）。该 key 决定这笔现金商品对应哪一枚装扮——用户在身份中心的装扮卡片上会看到「￥价格 购买」按钮。填错或缺失时该商品不会下发到小程序（插件日志会告警），用户点现金购买也会被拦下并提示配置错误——不会出现「付了钱拿不到」的情况。展示名称自动取装扮商店里的名称，此处填的名称不生效。

    - group: contentConfig
      label: 付费内容（阅读券）
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "用「阅读券」解锁付费文章。付费文章<b>不在本插件里维护清单</b>，而是在 Halo 后台给文章打上指定 slug 的标签（默认 paid）即可，站长无需重复配置。<br /><b>⚠️ 生效范围</b>：拦截点在文章详情 API，因此付费墙<b>只保护小程序端</b>；Halo 网页版主题通过 permalink 直接渲染内容、不走该 API，博客网站本身仍可阅读全文。若需网页端也付费，需另行改造主题或使用 Halo 原生「私有/内部」可见性。<br /><b>合规提示</b>：券可累积、可跨文章通用，语义上接近代币，个人主体下能否通过审核取决于审核判断，建议小额试探后再放量。"
        - $formkit: switch
          name: enabled
          id: contentEnabled
          label: 开启付费内容
          value: false
          help: 关闭时所有文章均可自由阅读，不会拦截任何请求。默认关闭，需显式开启。
        - $formkit: text
          name: paidTagSlug
          label: 付费标记标签 slug
          value: "paid"
          validation: required
          help: 文章只要带有该 slug 的标签即视为付费文章。请先在 Halo 后台【文章 - 标签】创建该标签（slug 需完全一致，区分大小写时以本插件按小写比较为准）。填了不存在的 slug 会导致付费功能静默失效——所有文章都不拦截，插件日志会输出告警。
        - $formkit: number
          name: costTickets
          label: 解锁消耗券张数
          value: 1
          min: 1
          help: 解锁一篇付费文章消耗的阅读券张数，至少为 1（填 0 或负数会被强制回落为 1，避免变成免费解锁）。
        - $formkit: switch
          name: freeForOwner
          label: 博主本人免费
          value: true
          help: 开启后，文章作者本人（微信用户已绑定的 Halo 账号与文章 owner 一致）阅读自己的付费文章时不拦截、不扣券。建议保持开启。
        - $formkit: switch
          name: permanent
          label: 解锁永久有效
          value: true
          help: 解锁记录永久保存，同一篇文章不会重复扣券。关闭暂不支持限时解锁，仅作语义占位，请勿关闭。
        - $formkit: switch
          name: freeForDigest
          label: AI 日报文章免券（建议保持开启）
          value: true
          help: 开启后，「AI 日报」自动生成的文章不需要阅读券即可阅读，无论它们带了什么标签。<br />为什么建议开启：日报是拉新与留存的入口——用户从分享、搜索进来，点开的第一篇往往就是日报文章；如果这里被付费墙拦住，新用户第一眼就被要求用券解锁，转化直接归零，而且这种拦截很难归因到配置上。确实希望日报也收费时再关掉此项。

    - group: ticketConfig
      label: 阅读券获取
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "阅读券（解锁付费文章）此前只有 <b>现金直购</b> 与 <b>积分兑换</b> 两条获取途径，用户从没体验过券能解锁什么就先撞上了付费墙，付费转化因此很低。本分组提供「<b>免费的第一次</b>」：让用户零成本拿到券、用掉一张、看到墙后面的内容，才会为下一篇付钱。<br /><b>力度建议</b>：赠券力度直接决定付费转化。签到天天送券会让日活用户永远不必付费；相反对照组是「新人送 1 张、首购再送 1 张、连签 7 天送 2 张」——用户先体验，再为下一篇买单。<br /><b>任务送券</b>在「每日任务」分组里按任务单独配置（字段 tickets），按完成次数结算，力度比签到更可控，建议优先用它。"
        - $formkit: number
          name: newUserTickets
          label: 新人见面礼赠送张数
          value: 1
          min: 0
          help: 微信用户首次登录领取新人礼时附带赠送的阅读券张数。填 0 表示不送。升级前已领过新人礼的老用户会在下次登录时补到这一次券。
        - $formkit: number
          name: firstPurchaseTickets
          label: 首单礼赠送张数
          value: 1
          min: 0
          help: 用户在本站的<b>第一笔</b>成功订单额外赠送的阅读券张数（任意道具类型都算）。「第一次付钱」的心理门槛远高于第二次，首单加送一张券等于让用户用同一笔钱拿到两篇内容。填 0 表示不送。
        - $formkit: number
          name: signInTickets
          label: 每日签到赠送张数
          value: 0
          min: 0
          help: 每次签到赠送的阅读券张数。<b>默认 0（关闭）</b>：解锁一篇付费文章只需 1 张券，天天签到送券等于让活跃用户完全不必付费，请确认经营策略后再开启。
        - $formkit: number
          name: streakDays
          label: 连签奖励门槛天数
          value: 7
          min: 0
          help: 连续签到达到该天数时额外赠券，之后按周期重复（连签 7/14/21 天各发一次，而不是只在第 7 天发一次——后者会让坚持到第 8 天的用户觉得奖励已经拿完了）。填 0 表示不启用连签奖励。
        - $formkit: number
          name: streakTickets
          label: 连签奖励张数
          value: 1
          min: 0
          help: 达到连签门槛时额外赠送的阅读券张数，与「每日签到赠送张数」叠加发放。
        - $formkit: number
          name: exchangeTickets
          label: 积分兑换每次发放张数
          value: 1
          min: 1
          help: 在「积分商城」用积分兑换阅读券时，每次兑换发放的张数，同时决定兑换项名称（如「阅读券 x2」）。至少为 1——填 0 会导致「扣了积分却不发券」。
        - $formkit: number
          name: exchangePoints
          label: 积分兑换默认定价
          value: 150
          min: 1
          help: 推荐 150（约 1.5 元购买力，比现金单张 ￥1.2 贵 25%——券能直接解锁付费文章，积分通道要比现金贵一点，否则没人会付钱买券）。当「积分商城 → 兑换权益」里没有 content_ticket 这一项时，插件会自动补一条内置的阅读券兑换项并使用该定价。若你已在积分商城里手工配了 content_ticket，则以你的配置为准，本字段不生效。
    - group: subscriptionConfig
      label: 分类订阅额度
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "「发现」页的分类订阅：每位用户有<b>免费额度</b>，超出后可以用积分解锁更多额度（永久、可累计），或者购买会员卡把上限提到会员档。<br /><b>额度是容量不是占用</b>：取消某个订阅只腾出位置，已买的额度不会消失也不退款。<br />会员到期后，超出额度的订阅会<b>暂停</b>（记录与顺序都保留），续费或积分解锁后自动恢复——这是为了不让「买一次会员」变成永久权益。"
        - $formkit: switch
          name: enabled
          id: subscriptionQuotaEnabled
          label: 允许用积分解锁订阅额度
          value: false
          onValue: true
          offValue: false
          help: 关闭时用户只有免费额度，客户端也不会显示解锁入口。价格与开关是运营决策，默认关闭——没配价之前不该出现一个能花积分的入口。
        - $formkit: number
          name: freeQuota
          label: 免费额度（个）
          value: 5
          min: 1
          max: 200
          validation: required
          help: 不花积分就能订阅的分类数。原来写死的 5 就是它；改大只会让用户受益，改小会让已有用户超出额度（超出部分暂停）。
        - $formkit: number
          name: quotaPrice
          label: 每份额度的积分价格
          value: 300
          min: 1
          validation: required
          help: 用户点「解锁」时扣掉的积分。额度永久有效、可累计。
        - $formkit: number
          name: maxQuota
          label: 最多可解锁几份
          value: 10
          min: 0
          max: 200
          validation: required
          help: 防止无限扩容。用户最终能订阅的分类数 = 免费额度 + 已解锁份数。
        - $formkit: number
          name: memberMaxQuota
          label: 会员期内的订阅上限（个）
          value: 30
          min: 1
          max: 200
          validation: required
          help: 会员有效期内放宽到这个上限（对多数站点等于不限量）。仍要有硬顶：首页要按订阅的分类取内容，一个人订光全站会把首页拖成几十路请求。
        - $formkit: number
          name: homeFeedPerCategory
          label: 首页每个分类取几条
          value: 20
          min: 5
          max: 100
          validation: required
          help: 首页内容流（并集接口）内部按分类各取这么多条再合并。调大首页更全但内部请求更重。
        - $formkit: number
          name: hotCategoryCount
          label: 零订阅时推荐几个人气分类
          value: 3
          min: 1
          max: 10
          validation: required
          help: 新用户与游客还没订阅任何分类时，首页用订阅热度最高的这几个分类的内容当推荐；一片空白比推荐错更糟。
        - $formkit: number
          name: homeFeedCacheSeconds
          label: 首页内容流缓存秒数
          value: 60
          min: 0
          max: 3600
          validation: required
          help: 同一批分类在这段时间内只取一次。0 = 不缓存（每次请求都去取，订阅多时首页会变慢）。
    - group: subscriptionWallConfig
      label: 分类订阅墙
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "未订阅分类的文章：<b>列表可以浏览，阅读全文需要先订阅</b>。首页、榜单、邀请页等所有入口共用这道墙。<br />与「付费内容（阅读券）」互不叠加：打了付费标签的文章只走阅读券解锁，不会被订阅墙拦截。<br />建议开启顺序：先升级插件、更新小程序，再打开总开关——旧版小程序收到拦截响应会显示成付费解锁卡片。"
        - $formkit: switch
          name: enabled
          id: subscriptionWallEnabled
          label: 开启订阅墙
          value: false
          onValue: true
          offValue: false
          help: 开启后，未订阅分类的文章详情接口会被拦截并提示订阅。判定失败时一律放行（这是引导机制，不是安全边界），不会因插件内部错误导致全站文章打不开。
        - $formkit: switch
          name: gateGuests
          label: 游客也拦截
          value: true
          onValue: true
          offValue: false
          help: 开启后，未登录微信的游客点开文章详情会提示「登录并订阅后可读」。关闭则游客全站可读，只限制已登录但未订阅该分类的用户。
        - $formkit: switch
          name: memberFree
          label: 会员豁免订阅墙
          value: true
          onValue: true
          offValue: false
          help: 开启后，会员有效期内不用订阅也能读全站文章（「会员全站可读」权益）。关闭则会员与其他用户一样需要订阅，会员优势仅是订阅不限量。
        - $formkit: text
          name: freeCategories
          label: 永久免费分类（可选）
          value: ""
          help: 这些分类的文章所有人可读、不受订阅墙限制。填分类<b>显示名</b>（如「公告」），多个用英文逗号分隔。留空 = 不设白名单。
    - group: memberConfig
      label: 会员卡
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "会员卡是「<b>单次购买的有效期权益</b>」：用户一次付款，获得一段固定期限的权益。<br /><b>合规说明</b>：微信虚拟支付的适用场景明确包含「会员订阅：VIP 会员、专属权益包」，道具直购（short_series_goods）的定义就是「会员、课程等单品，支持单次购买」，因此本形态与已在售的「限时装扮」结构一致，属于合规范围。<br /><b>⚠️ 本插件不提供自动续费订阅</b>（连续包月/包年）：那需要单独申请签约能力、《会员自动续费服务协议》报平台审核、缴纳交易保证金、提前 5 日提醒与预扣费通知，并走 submit_subscribe_pay_order 等专用接口，还有一整套用户感知规范（醒目展示下次扣款时间、协议须勾选且不得默认勾选）。如需自动续费请单独评估。<br /><b>销售方式</b>：会员卡作为「虚拟支付 → 权益道具」中的一条商品，类型选 membership，道具数量填天数。"
        - $formkit: switch
          name: enabled
          id: memberEnabled
          label: 开启会员卡
          value: false
          onValue: true
          offValue: false
          help: 关闭时接口不下发会员状态、也不允许发货 membership 类型的商品。请先配好会员商品与到期权益再开启。
        - $formkit: number
          name: defaultDays
          label: 默认会员周期（天）
          value: 30
          min: 1
          help: 商品未填「道具数量」时的兜底天数。填 0 会被强制回落为 30——否则用户付了钱却一刻钟会员都不是。
        - $formkit: switch
          name: freeContent
          label: 会员期内付费文章免券
          value: true
          onValue: true
          offValue: false
          help: 开启后，有效期内会员阅读全站付费文章不消耗阅读券（也不写入任何扣券流水）。这是会员卡的核心权益，关闭后会员只剩「开通赠券」这一个价值。
        - $formkit: number
          name: bonusTickets
          label: 开通/续费额外赠送阅读券
          value: 0
          min: 0
          help: 每次开通或续费成功额外赠送的阅读券张数，填 0 表示不送。用于促单，也可让用户即使不常看付费文章也能感受到会员的价值。
    - group: aiContentConfig
      label: AI 定制内容
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "用户购买「<b>AI 定制内容</b>」（虚拟支付 → 权益道具，类型选 <code>ai_content</code>）后，可以在小程序里自行勾选<b>主题分类 / 来源站点 / 关键词</b>，服务端据此从<b>你已生成的 AI 日报内容</b>里筛出属于他的每日简报，并用一次 AI 调用写导语与推荐理由。<br /><b>与「分类订阅」的区别</b>：分类订阅是免费的，管的是首页与分类页按分类筛站点文章；本功能是付费的独立链路，产出的是「我的简报」这一份个人内容。<br /><b>成本边界</b>：每位有效用户<b>每天最多 1 次 AI 调用</b>（当天简报已生成即复用，反复打开不重复调用）；把下面「生成 AI 导语」关掉即退化为零 AI 成本的纯筛选。<br /><b>合规说明</b>：与会员卡一样是「单次购买 + 有效期」的道具，<b>不做自动续费订阅</b>；文案请避免使用「包月 / 订阅」字样。"
        - $formkit: switch
          name: enabled
          label: 开启 AI 定制内容
          value: false
          onValue: true
          offValue: false
          help: 关闭时小程序不显示入口、接口一律拒绝、也不允许发货 ai_content 类型的商品。请先配好商品与 AI 通道再开启。
        - $formkit: switch
          name: aiIntroEnabled
          label: 生成 AI 导语与推荐理由
          value: true
          onValue: true
          offValue: false
          help: 开启时，用户打开简报会用一次 AI 调用写导语、微调排序并给每篇一句推荐理由。关闭后只做纯筛选（按主题/来源/关键词打分排序），零 AI 成本、打开即秒开——AI 额度紧张或用户量上来后可以先关掉它。
        - $formkit: number
          name: maxCategories
          label: 用户最多勾选几个主题分类
          value: 5
          min: 1
          help: 可选范围来自「AI 日报 → 分类清单」，用户只能在你配置的分类里选。填太大会让简报失去聚焦，建议 3-5。
        - $formkit: number
          name: maxSources
          label: 用户最多勾选几个来源站点
          value: 5
          min: 1
          help: 可选范围来自最近日报里<b>实际出现过</b>的来源，用户不会配到一个从来没有内容的来源。
        - $formkit: number
          name: maxKeywords
          label: 用户最多填几个关键词
          value: 10
          min: 0
          help: 填 0 表示关掉这个维度（用户端不再显示关键词输入框）。
        - $formkit: number
          name: maxItems
          label: 一份简报最多几条内容
          value: 10
          min: 1
          help: 简报是「今日份」的，条数太多就不再是精选。建议 5-10。
        - $formkit: number
          name: windowDays
          label: 从最近几天的日报里筛
          value: 7
          min: 1
          help: 只回看最近这些天已发布的日报内容。窗口太小（如 1 天）会让偏好较窄的用户经常看到空简报。
        - $formkit: number
          name: introWords
          label: AI 导语字数上限
          value: 200
          min: 50
          help: 导语是简报开头那段「今天为你挑了什么」，太长会占满首屏。
        - $formkit: text
          name: benefitNote
          label: 权益说明文案（未开通页展示）
          value: ""
          help: 留空则用通用文案。可以写成一行一条，例如「每天一份按你兴趣挑的精选｜可随时调整关注主题｜有效期内不限次查看」。价格由商品配置决定，不在这里填。
        - $formkit: number
          name: maxTopics
          label: 用户最多手输几个定制主题
          value: 3
          min: 0
          max: 5
          help: 「定制主题」是用户手工输入的（如「想了解大模型在教育的落地」），简报会优先围绕它检索素材、AI 再按主题重写。填 0 表示关掉手输维度。
        - $formkit: switch
          name: fallbackGenerateEnabled
          label: 素材不足时允许 AI 直接生成
          value: true
          onValue: true
          offValue: false
          help: 开启后，用户定制主题在最近日报里找不到足够素材时，AI 会按主题直接原创写一篇短文（约束不编造具体数据与事件）。关闭则只做检索，检索不到就提示放宽方向。
        - $formkit: number
          name: pointsPrice
          label: 积分解锁价格（0=关闭积分通道）
          value: 0
          min: 0
          help: 大于 0 时，用户可以用积分兑换权益（与现金直购道具等效，叠加在同一个到期时间上）；0 表示只能通过虚拟支付道具获取。<br /><b>推荐 800</b>（对应 30 天）：若你的现金价是 ￥6~8/30 天，积分价低于 600 会让现金通道彻底卖不动——用户攒几天就能白拿一个月。<b>经验公式：积分价 ≈ 现金价（元）× 100</b>。
        - $formkit: number
          name: pointsDays
          label: 积分一次兑换的天数
          value: 30
          min: 1
          help: 用户每兑换一次，权益在现有到期时间上叠加这么多天。
        - $formkit: switch
          name: memberFree
          label: 会员期内免条件使用
          value: true
          onValue: true
          offValue: false
          help: 开启后，付费会员在会员有效期内不用购买道具或积分兑换，直接可用本功能（与「会员免券」「会员全站可读」同一权益口径）。
        - $formkit: textarea
          name: presetTopics
          label: 预设定制主题选项（可选）
          value: ""
          help: 供用户一键选择的定制主题建议，用逗号或换行分隔，如「AI 工具实测,开源项目点评,行业趋势分析,安全漏洞预警,学习路线,职业发展」。留空则只显示手输框与站内分类。
        - $formkit: switch
          name: homeCardEnabled
          label: 首页展示运营位卡片
          value: true
          onValue: true
          offValue: false
          help: 开启后首页轮播下方出现「AI 定制内容」入口卡（一眼可见）。<b>这是该功能在小程序里唯一的入口</b>（「我的」页已不再放置入口），关闭后用户将无法进入定制内容页——只有你主动推送的简报链接还能把人带进去。
        - $formkit: text
          name: homeCardTitle
          label: 首页卡片标题
          value: "AI 定制内容"
          help: 留空用默认文案。
        - $formkit: text
          name: homeCardDesc
          label: 首页卡片描述
          value: "每天一份为你定制的技术简报"
          help: 留空用默认文案。
    - group: rankConfig
      label: 榜单
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "小程序「榜单」页由「文章榜（按浏览/点赞）」与「用户榜（累计积分 / 近 7 日活跃 / 邀请）」两部分组成，榜单对未登录用户同样可见。用户榜依赖积分系统，积分系统关闭时用户榜不展示。"
        - $formkit: switch
          name: enabled
          label: 开启榜单功能
          value: true
          onValue: true
          offValue: false
          help: 关闭后小程序「榜单」页不展示任何榜单数据（用户榜与互动动态接口同时停止下发，页面提示榜单未开启）。文章榜接口只返回公开的浏览量排行，不随该开关停用，但关闭后小程序端不会再请求它。
        - $formkit: switch
          name: showScore
          label: 公开榜单分值
          value: true
          onValue: true
          offValue: false
          help: 关闭后用户榜只显示名次、等级与称号，不显示具体积分与邀请人数（适用于不希望公开用户分值的站点）。
        - $formkit: switch
          name: enableInviteBoard
          label: 展示邀请榜
          value: true
          onValue: true
          offValue: false
          help: 邀请榜按成功邀请的人数排名，数据来自邀请关系；关闭后用户榜只剩「总积分 / 近 7 日」两个榜单。
        - $formkit: switch
          name: wallEnabled
          label: 展示互动动态
          value: true
          onValue: true
          offValue: false
          help: 展示最近用户的评论、点赞、投票动态（仅昵称、头像与内容标题，内容均为站点上已公开的信息）。浏览量不上墙。
        - $formkit: number
          name: wallLimit
          label: 互动动态条数
          value: 10
          min: 1
          max: 30
          help: 一次下发的动态条数，最大 30。
        - $formkit: switch
          name: wallIncludeUpvote
          label: 动态中包含「点赞」
          value: false
          onValue: true
          offValue: false
          help: 默认不包含：点赞是轻量动作，默认把「谁赞了哪篇」公开给其他访问者对用户偏侵扰。开启后动态会更活跃。评论与投票本就是公开行为，始终展示。
        - $formkit: switch
          name: weeklyRewardEnabled
          label: 开启周榜奖励
          value: false
          onValue: true
          offValue: false
          help: 开启后，每周一自动结算上一自然周（周一 00:00 ~ 周日 24:00）的活跃榜并发放积分，同一周同一用户只发一次。发放记录可在用户「积分明细」中查看（类型：榜单奖励）。默认关闭。
        - $formkit: number
          name: weeklyRewardTopN
          label: 奖励名次数量
          value: 3
          min: 1
          max: 10
          help: 只给活跃榜前 N 名发奖，最多 10 名。
        - $formkit: number
          name: weeklyRewardPoints
          label: 第 1 名奖励积分
          value: 60
          min: 0
          help: 第 1 名的积分奖励。填 0 或递减到 0 的名次不发放（该名次不产生流水）。
        - $formkit: number
          name: weeklyRewardStep
          label: 名次递减积分
          value: 20
          min: 0
          help: 每往后一名少发多少积分（第 2 名 = 第 1 名 - 递减值，依此类推），减到 0 为止。
    - group: pushConfig
      label: 消息推送（微信订阅消息）
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "用户订阅了分类后，该分类有新文章时给他发一条<b>微信服务通知</b>；付费「AI 定制内容」的简报就绪时也提醒一条。<br /><b>必须先知道微信的规则</b>：普通类目只能用「<b>一次性订阅消息</b>」——用户点一次授权，只能发一条（可累积）。长期订阅只对政务民生/医疗/交通/金融/教育等类目开放，本站拿不到。小程序的做法：用户同意一次之后，在他读文章、点分类这些本来就要做的动作里自动续上额度（微信允许在用户点击后调用；勾过「总是保持以上选择」就不会再弹窗），不需要他反复回来点授权，页面上也不再显示「剩余几条」。<br /><b>准备工作</b>：① 在小程序后台「订阅消息」里选好模板并<b>绑定服务类目</b>（类目不符会报 43102，通知发不出去）；② 把模板 ID 填到下面。默认已填好「内容更新通知」模板。<br /><b>合规红线</b>：订阅消息不得用于营销/广告，也不得诱导订阅（「订阅送积分」这类玩法违规），请只用于真实的内容更新提醒。"
        - $formkit: switch
          name: enabled
          label: 开启消息推送
          value: false
          onValue: true
          offValue: false
          help: 关闭时不检查、不发送，小程序也不显示推送入口。请先把模板配好再打开。
        - $formkit: text
          name: templateId
          label: 新文章提醒模板 ID
          value: "wTqRnFopbwyBQU_8gJvPdTpOLzS2h9xgikQxcSuUf4k"
          help: 在小程序后台「订阅消息 → 我的模板」里复制。模板字段必须是：文章标题 / 文章摘要 / 发布时间 / 文章来源 / 温馨提示（对应 thing4 / thing6 / time3 / thing7 / thing5）。字段不同会在下发时报 47003。
        - $formkit: text
          name: aiDigestTemplateId
          label: 简报提醒模板 ID
          value: ""
          help: 在「订阅消息 → 我的模板」里<b>单独申请</b>一个用于「你的定制简报已生成」的模板，把模板 ID 填这里。<b>不要留空、也不要用新文章模板</b>：两个模板的字段不同，复用会在下发时报 47003。
        - $formkit: text
          name: aiDigestFieldTopic
          label: 简报-主题字段名
          value: "thing1"
          help: 模板里「主题」那个字段的字段名（thing 类型，如 thing1）。内容固定为「你的定制简报已生成」。
        - $formkit: text
          name: aiDigestFieldContent
          label: 简报-内容字段名
          value: "thing2"
          help: 模板里「内容/摘要」那个字段的字段名（thing 类型，如 thing2）。内容形如「3 条内容 · 大模型在教育行业的落地」。
        - $formkit: text
          name: aiDigestFieldTime
          label: 简报-时间字段名
          value: "time3"
          help: 模板里「时间」那个字段的字段名（<b>必须是 time 类型</b>，如 time3）。会自动格式化成「2026年9月29日 09:00」。
        - $formkit: text
          name: aiDigestFieldTip
          label: 简报-提示字段名
          value: "thing3"
          help: 模板里「温馨提示/备注」那个字段的字段名（thing 类型，如 thing3）。内容固定为「点击查看你的专属简报」。
        - $formkit: switch
          name: newPostEnabled
          label: 订阅分类有新文章时提醒
          value: true
          onValue: true
          offValue: false
          help: 只推给「订阅了该分类」且还有提醒额度的用户；每人每天最多一条（当天的多篇更新合并成一条）。
        - $formkit: switch
          name: aiDigestEnabled
          label: 允许「AI 定制内容」推送（付费权益）
          value: true
          onValue: true
          offValue: false
          help: 关闭后：用户端不显示推送设置卡，「立即推送」接口也会拒绝。开启前请先把上面的简报模板与四个字段名配好。
        - $formkit: switch
          name: aiDigestScheduleEnabled
          label: 允许用户设置「每日定时推送」
          value: true
          onValue: true
          offValue: false
          help: 开启后，用户在 AI 定制内容页可以选一个整点，服务端到点会<b>先为他生成简报再推送</b>（只有开了推送的用户才会被提前生成，不会给不活跃用户白烧 AI）。关闭后只保留用户手动「立即推送」。
        - $formkit: text
          name: aiDigestPushHours
          label: 用户可选的推送整点
          value: "8,12,18,21"
          help: 逗号分隔的整点（0-23）。这是给用户选的时段，也是服务端分桶依据——用户分散在不同整点，服务端峰值被摊平。建议 3-5 个时段。
        - $formkit: number
          name: aiDigestMaxUsersPerRun
          label: 每轮定时生成最多处理多少人
          value: 200
          min: 1
          help: 兜底上限。到点的那一大批用户如果超过这个数，剩下的下一轮继续（每分钟醒一次，不会漏）。
        - $formkit: number
          name: checkIntervalMinutes
          label: 检查间隔（分钟）
          value: 5
          min: 1
          help: 每隔这么久检查一次「有没有新文章 / 今天的日报是否已发布」。调小只会让提醒更及时，不会增加推送条数（每人每天每类仍然最多一条）。
        - $formkit: number
          name: maxItemsPerMessage
          label: 一条消息里最多提几篇
          value: 3
          min: 1
          help: 超过这个数量只报总数（如「共 8 篇新文章」），避免标题字段被塞满。
        - $formkit: number
          name: dailySendLimit
          label: 整站每日发送上限
          value: 500
          min: 1
          help: 保护性上限：当天发满这么多条就停止发送并记日志。防止间隔配得太小、或用户量突增时把微信接口打爆。
        - $formkit: number
          name: lookbackHours
          label: 停机后的回看窗口（小时）
          value: 24
          min: 1
          help: 插件停机（或没开机）期间发布的新文章，重启后按这个窗口补推，不会漏掉。填太大会在重启后一次补推很多。
        - $formkit: select
          name: miniprogramState
          label: 点击通知跳转的小程序版本
          value: formal
          options:
            - label: 正式版（线上）
              value: formal
            - label: 体验版（测试用）
              value: trial
            - label: 开发版
              value: developer
          validation: required
          help: 用体验版测试推送时必须改成「体验版」，否则用户点开跳到线上正式版、看不到新页面，会误以为推送坏了。上线前记得改回「正式版」。

    - group: aiDigestConfig
      label: AI 日报
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "从 Karpathy 推荐的 92 个顶级技术博客抓取最新文章，用 AI 评分筛选后生成一份 Markdown 日报，并通过 Halo 官方接口上传头图、建稿并发布。每次运行需要约 1-3 分钟、若干次大模型调用，会产生 API 费用；定时执行依赖服务器对境外站点的出网能力。"
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "当前插件版本：<b>1.0.170</b>（若这里显示的不是该版本，说明运行中的 jar 还没更新）。独立管理页（不依赖控制台前端缓存，可直接打开操作）：<code>{site}/apis/api.uni.uhalo.pro/v1alpha1/plugins/plugin-uni-halo/ai-digest-admin</code>。控制台内页面位置：左侧菜单 <b>UniHalo → AI 日报</b>（在「邀请好友」下面）；大模型通道的开关、排序与连通性测试就在该页面的「大模型通道」面板里。若看不到该菜单项，请先在插件列表里重载插件并强制刷新浏览器（Ctrl+Shift+R）。"
        - $formkit: switch
          name: enabled
          id: aiDigestEnabled
          label: 开启 AI 日报
          value: false
          onValue: true
          offValue: false
          help: 关闭后定时任务与后台「立即生成」都不执行。默认关闭：日报会自动发布文章，需站长确认 AI Key 与发布参数后主动开启。
        - $formkit: switch
          name: scheduleEnabled
          if: "$get(aiDigestEnabled).value === true"
          label: 开启定时生成
          value: true
          onValue: true
          offValue: false
          help: 关闭后仍可在插件后台「AI 日报」页面手动生成。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: scheduleTimes
          label: 每天执行时刻
          value: "07:00"
          validation: required
          help: 24 小时制，格式 HH:mm，例如 07:00 表示每天凌晨 7 点执行。需要一天多次时用逗号分隔，例如 07:00,19:00。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: timezone
          label: 时区
          value: "Asia/Shanghai"
          validation: required
          help: 执行时刻按该时区计算，填错会退回 Asia/Shanghai。
        - $formkit: repeater
          if: "$get(aiDigestEnabled).value === true"
          name: aiProviders
          label: 大模型通道清单（顺序即优先级）
          value: []
          help: "要接多家大模型、或想让某条通道只当备用，就填这张清单：<b>数组顺序即调用顺序</b>，第一条失败自动跳下一条；每条的<b>启用</b>开关关掉后它既不参与调用也不参与转移。<b>清单一填，下面那组「兼容通道」就不再生效</b>；清单留空则行为与升级前完全一样（主通道 + 兜底通道）。最多 10 条。<br>每条的<b>用途</b>决定它接什么活：评分一轮要跑几十次、只要便宜模型；成稿一轮只跑两三次但单次上千字、直接决定读者观感，建议留给强模型（例如便宜通道填 <code>score,overview,classify,content</code>，强通道填 <code>write</code>）。留空 = 什么活都接（与升级前一致）。<br>更顺手的管理方式（开关 + 用途勾选 + 排序 + <b>逐条测试连通性</b>）在控制台页面：<b>UniHalo → AI 日报 → 大模型通道</b>。"
          children:
            - $formkit: switch
              name: enabled
              label: 启用这条通道
              value: true
              onValue: true
              offValue: false
            - $formkit: text
              name: label
              label: 显示名（如 DeepSeek 主用）
              value: ""
            - $formkit: text
              name: apiBase
              label: API Base
              value: ""
              help: 需兼容 OpenAI 的 chat/completions 协议，一般以 /v1 结尾。DeepSeek 填 https://api.deepseek.com/v1，通义千问填 https://dashscope.aliyuncs.com/compatible-mode/v1。
            - $formkit: password
              name: apiKey
              label: API Key
              value: ""
            - $formkit: text
              name: model
              label: 模型名
              value: ""
              help: 留空时按端点推断（含 deepseek 用 deepseek-chat，否则用 gpt-4o-mini）。
            - $formkit: text
              name: tasks
              label: 用途（逗号分隔，留空 = 全部用途）
              value: ""
              help: "可填：<code>score</code> 评分（一轮几十次，适合便宜模型）、<code>write</code> 成稿（单次输出上千字，建议强模型）、<code>overview</code> 日报看点与背景、<code>classify</code> 旧文章归类、<code>content</code> 付费简报。例：<code>score,overview,classify,content</code>。写错或留空都不会出错——认不出来的标识会被忽略。<br>某条通道的用法被别的通道顶替时（例如只勾了「评分」的便宜通道被关掉），插件会<b>回退</b>到全部可用通道并在日志与后台面板里写明，不会让整轮日报失败。"
            - $formkit: text
              name: key
              label: 通道标识（留空会自动生成，一般不用改）
              value: ""
              help: 后台「测试连通性」按它找到这条通道已保存的 Key，因此不要在已有通道上随意改这个值。
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: balanceCheckEnabled
          label: 运行前后查询账户余额
          value: true
          onValue: true
          offValue: false
          help: 开启后，每次生成会在开始与结束时各查一次各通道的账户余额（DeepSeek 官方 <code>GET /user/balance</code> 接口，不消耗 token），报告里给出「余额 X → Y（实际扣减 Z）」。它用来校验上面的估算准不准；注意余额是<b>账号级</b>数据，同一账号下别的应用/别的 Key 的消耗也会算进这个差值。非 DeepSeek 的端点会自动跳过并在面板上标明「不支持」。
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: priceAutoRefreshEnabled
          label: 自动读取官网单价
          value: true
          onValue: true
          offValue: false
          help: "开启后：不填下面的单价表也能算花费——插件内置了官方价目表（DeepSeek 当前在售模型），并会在价格表为空时自动去官网读一次，之后按官网的算。<br>读不到（页面改版、服务器出网受限）就继续用内置表，只记一条日志——<b>绝不猜数字</b>。控制台「AI 日报 → 大模型通道」里有「🔄 从官网刷新单价」按钮可以随时手动读。"
        - $formkit: repeater
          if: "$get(aiDigestEnabled).value === true"
          name: aiPrices
          label: 模型单价（一般不用填）
          value: []
          help: "通常<b>留空即可</b>：留空时用内置/官网读取的价目表（DeepSeek 官方价，已按高峰/空闲双价折算）。<br>需要手填的只有两种情况：① 用了别的供应商（OpenAI、通义千问等），内置表里没有；② 你走的是中转站、结算价与官方不同。<br>填的都是<b>高峰时段</b>的价（每百万 token），空闲时段按下面的折扣折算——官方口径是空闲 = 高峰的一半。<br>匹配规则：先精确匹配模型名，再按<b>最长的包含匹配</b>，所以填一条 <code>deepseek</code> 就能覆盖同族新模型。<br>口径提醒：<b>缓存命中输入价常是未命中价的几十分之一</b>，而日报评分的提示词前缀固定、极易命中前缀缓存，所以两者要分开填（官方命中 0.02 元 vs 未命中 1 元）。"
          children:
            - $formkit: text
              name: model
              label: 模型匹配串（如 deepseek、gpt-4o-mini）
              value: ""
            - $formkit: text
              name: currency
              label: 币种（CNY / USD）
              value: ""
            - $formkit: text
              name: cacheHit
              label: 高峰价 · 缓存命中输入
              value: ""
            - $formkit: text
              name: cacheMiss
              label: 高峰价 · 缓存未命中输入
              value: ""
            - $formkit: text
              name: output
              label: 高峰价 · 输出
              value: ""
            - $formkit: text
              name: offPeakRatio
              label: 空闲时段折扣（默认 0.5）
              value: ""
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: aiApiBase
          label: 兼容通道：主模型 API Base
          value: "https://api.deepseek.com/v1"
          validation: required
          help: 这组「主 / 兜底」字段是升级前的老配置，只在上面那张通道清单留空时生效。需要兼容 OpenAI 的 chat/completions 协议。DeepSeek 填 https://api.deepseek.com/v1，通义千问填 https://dashscope.aliyuncs.com/compatible-mode/v1。
        - $formkit: password
          if: "$get(aiDigestEnabled).value === true"
          name: aiApiKey
          label: 兼容通道：主模型 API Key
          value: ""
          validation: required
          help: 仅保存在服务端、不会下发到小程序。DeepSeek 可在 platform.deepseek.com 创建。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: aiModel
          label: 兼容通道：主模型名称
          value: "deepseek-chat"
          validation: required
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: fallbackApiBase
          label: 兼容通道：兜底 API Base（可选）
          value: ""
          help: 主模型调用失败时自动切换，留空则不启用兜底。同样需要兼容 OpenAI 协议。
        - $formkit: password
          if: "$get(aiDigestEnabled).value === true"
          name: fallbackApiKey
          label: 兼容通道：兜底 API Key（可选）
          value: ""
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: fallbackModel
          label: 兼容通道：兜底模型名称（可选）
          value: ""
          help: 留空时按兜底端点自动推断（含 deepseek 用 deepseek-chat，否则用 gpt-4o-mini）。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: hours
          label: 抓取时间范围（小时）
          value: 48
          min: 1
          max: 720
          validation: required
          help: 只保留该时间窗内发布的文章，48 小时通常刚好覆盖一个完整工作日。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: topN
          label: 精选篇数
          value: 15
          min: 1
          max: 50
          validation: required
          help: AI 评分后保留的篇数，10 篇偏精简、20 篇偏扩展。这是本期总数上限，各分类的保底篇数优先于它。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: minPerCategory
          label: 每个分类至少几篇
          value: 1
          min: 0
          max: 10
          validation: required
          help: 默认 1：先给分类清单里的每个分类各留够这个篇数（优先挑带封面图的），剩下的名额再按分数补满「精选篇数」。填 0 关闭配额，回到「全局按分数取前 N 名」的老行为（那种情况下某些分类可能一篇都没有）。归入「其他」的兜底分类不参与配额。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: maxPerCategory
          label: 每个分类最多几篇
          value: 0
          min: 0
          max: 50
          validation: required
          help: 0 = 不限（默认）。某个分类高分文章特别多、把名额全占了时可以填 2-3 压一压，让分类分布更均匀。
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: categoryFallbackEnabled
          label: 分类没素材时放宽时间窗补抓
          value: true
          onValue: true
          offValue: false
          help: 开启后，某个分类在时间窗内一篇候选都没有时，会用下面的「补抓时间窗」再抓一轮把它补上（只补缺口分类）。代价是多一轮 RSS 抓取 + 一轮 AI 评分，且只在确实有缺口时才会发生。关闭则本期该分类不发文章，报告里会标注原因。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: categoryFallbackHours
          label: 补抓时间窗（小时）
          value: 168
          min: 1
          max: 720
          validation: required
          help: 补抓用的时间范围，默认 168 小时（7 天）：让更新慢的分类也能找到一篇可发的文章。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: categoryFallbackScanLimit
          label: 补抓最多再评几篇
          value: 30
          min: 1
          max: 100
          validation: required
          help: 补抓时按发布时间倒序最多再评这么多篇，用于控制 AI 调用成本。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: words
          label: 每篇目标字数
          value: 600
          min: 80
          max: 2000
          validation: required
          help: 概述 + 核心论点合计字数。实测 300-800 字能贴合目标，超过 1000 后模型会明显欠稿；想加长建议增加篇数而不是继续调高单篇字数。要发博客建议 600 以上。
        - $formkit: select
          if: "$get(aiDigestEnabled).value === true"
          name: language
          label: 摘要语言
          value: "zh"
          options:
            - label: 中文
              value: "zh"
            - label: English
              value: "en"
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: imageEnabled
          label: 抓取并上传文章头图
          value: true
          onValue: true
          offValue: false
          help: 头图取自 RSS 正文内嵌图片或文章页的 og:image，通过 Halo 官方附件接口上传到附件库后在正文中引用。实测约六成文章能配上图，抓不到的直接跳过。
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: requireImage
          label: 只发布带封面图的文章
          value: true
          onValue: true
          offValue: false
          help: 开启后，没配到头图（或头图上传失败）的文章会被过滤掉，由后续名次有图的文章补位；如果整轮都没配到图，本次运行会直接失败并说明原因，不会发出无图文章。关闭则允许发布无封面图的文章。
        - $formkit: select
          if: "$get(aiDigestEnabled).value === true"
          name: coverFallbackMode
          label: 配不到封面图时
          value: "placeholder"
          options:
            - label: 自动生成标题卡片封面
              value: "placeholder"
            - label: 允许该篇无封面
              value: "no-cover"
            - label: 跳过该篇
              value: "skip"
          help: 某个分类的候选文章全都配不到图时怎么办。默认「生成标题卡片」：服务端按分类色 + 分类名 + 标题 + 日期画一张 1200×675 的卡片上传到附件库，这样每个分类都能保证「至少一篇带封面」。卡片用的是插件内置的中文字体（约 1.4MB，随插件分发），所以服务器不用装字体；碰到内置字库里没有的生僻字会只省略那个字，不会画成方框。「允许无封面」保住篇数但列表里没有配图；「跳过该篇」则该分类本期可能没有文章，报告里会写明原因。
        - $formkit: attachmentPolicySelect
          if: "$get(aiDigestEnabled).value === true"
          name: attachmentPolicyName
          key: attachmentPolicyName
          label: 附件存储策略（可选）
          value: ""
          help: 留空则复用「应用配置」里的附件策略；那里也没有时使用默认策略 default-policy。用选择器而不是手填：策略名填错会让头图全部传不上去，而且从界面上看不出原因。
        - $formkit: attachmentGroupSelect
          if: "$get(aiDigestEnabled).value === true"
          name: attachmentGroupName
          key: attachmentGroupName
          label: 附件分组（可选）
          value: ""
          help: 留空则复用「应用配置」里的附件分组。
        - $formkit: select
          if: "$get(aiDigestEnabled).value === true"
          name: publishMode
          label: 发布方式
          value: "per-article"
          options:
            - label: 逐篇发布精选文章（每篇一篇独立文章）
              value: "per-article"
            - label: 合并为一篇 AI 日报
              value: "digest"
            - label: 两者都发
              value: "both"
          help: 默认「逐篇」：精选 N 篇就发 N 篇独立文章，每篇含中文标题、原文出处、头图、概述、核心论点与推荐理由。选「合并」则只发一篇含今日看点、数据概览与分类列表的日报；选「两者都发」会同时产出日报和每篇精选。任何模式都支持在后台「重新发布」，且逐篇模式下一篇失败不影响其它篇。
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: publishEnabled
          label: 生成后自动发布文章
          value: true
          onValue: true
          offValue: false
          help: 关闭后只生成日报并保存在后台，不发布文章（可随时在后台点「重新发布」）。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: haloBaseUrl
          label: Halo 接口地址（可选）
          value: ""
          help: 留空即用 http://127.0.0.1:服务端口（插件与 Halo 同进程，走本机回环）。若「后台能发文、插件发不了」，可在这里填站点地址（如 https://www.lxfzzw.com），让插件的请求与后台浏览器走完全一致的链路，以排除中间层差异。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: postOwner
          label: 文章作者
          value: "admin"
          validation: required
          help: Halo 用户名（不是昵称），默认 admin。填写的用户必须已存在，否则建稿会失败。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: postTitleTemplate
          label: 文章标题模板
          value: "AI 日报 · {date}"
          validation: required
          help: "{date} 会替换为日报日期（yyyy-MM-dd）；同时作为文章 slug 的来源。仅用于「合并为一篇 AI 日报」和「两者都发」模式——逐篇发布时每篇文章用各自的中文标题。" 
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "分类由 AI 从下方<b>分类清单</b>里选，再按所选方式落到站点分类上；标签由关键词自动生成。两者都不需要站长逐篇配置，只有想给所有日报文章再钉一个固定分类/标签时才填最后两项。<br/><b>注意</b>：自动创建出来的分类带 <code>uni.uhalo.pro/auto-generated</code> 标签，可在 Halo 后台区分；它们也会出现在小程序的分类页里，不想这样的话把「分类落库方式」改成「只复用已有分类」或「按映射指定」。"
        - $formkit: repeater
          if: "$get(aiDigestEnabled).value === true"
          name: digestCategories
          label: 分类清单（AI 只能从这里选）
          value:
            - key: ai-ml
              label: AI / ML
              emoji: "🤖"
              desc: AI、机器学习、大模型、深度学习相关
              targetCategory: ""
            - key: security
              label: 安全
              emoji: "🔒"
              desc: 安全、隐私、漏洞、加密相关
              targetCategory: ""
            - key: engineering
              label: 工程
              emoji: "⚙️"
              desc: 软件工程、架构、编程语言、系统设计
              targetCategory: ""
            - key: tools
              label: 工具 / 开源
              emoji: "🛠"
              desc: 开发工具、开源项目、新发布的库与框架
              targetCategory: ""
            - key: opinion
              label: 观点 / 杂谈
              emoji: "💡"
              desc: 行业观点、个人思考、职业发展与文化评论
              targetCategory: ""
            - key: other
              label: 其他
              emoji: "📝"
              desc: 暂时不适合归入其余主题的内容
              targetCategory: ""
          help: "上面预填的是插件内置的六类，可直接改：<b>英文标识</b>会写进 AI 提示词（AI 只能从清单里选），也用作自动创建分类时的 slug；<b>中文显示名</b>是日报正文里的归类小标题。<b>整份清单留空</b>等于沿用内置六类，行为与升级前一致。最多 12 条；重复的英文标识只取第一条。"
          children:
            - $formkit: text
              name: key
              label: 英文标识（如 tech、finance；留空则忽略该行）
              value: ""
            - $formkit: text
              name: label
              label: 中文显示名
              value: ""
            - $formkit: text
              name: emoji
              label: 图标 emoji
              value: ""
            - $formkit: text
              name: desc
              label: 给 AI 的判定说明
              value: ""
            - $formkit: text
              name: targetCategory
              label: 映射到已有分类名（可选）
              value: ""
        - $formkit: select
          if: "$get(aiDigestEnabled).value === true"
          name: categoryMode
          label: 分类落库方式
          value: create
          options:
            - label: 不存在就创建（默认，升级前行为）
              value: create
            - label: 只复用已有分类（匹配不到就不打分类）
              value: reuse
            - label: 按映射指定（用清单里填的「映射到已有分类名」）
              value: map
          validation: required
          help: "「只复用已有分类」会按英文标识或中文显示名去匹配站点已有分类，匹配不到就<b>不打分类</b>（这是有意的：手误不该在站点上多出分类）。「按映射指定」则用清单里那一列映射目标。两种方式都不会创建新分类——如果不想让日报在分类页里多出分类，选它们。"
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: autoCategoryEnabled
          label: 自动按文章主题归类
          value: true
          onValue: true
          offValue: false
          help: 关闭则完全不打 AI 判定的分类（只保留下面手填的固定分类）。开启时，每篇文章按 AI 从分类清单里选中的主题归入站点分类，落库方式见上一项。这样小程序端「按关注的分类看内容」才能生效——否则那些分类里永远没有文章。
        - $formkit: select
          if: "$get(aiDigestEnabled).value === true"
          name: unknownCategoryPolicy
          label: AI 选了清单外的分类时
          value: other
          options:
            - label: 归入「其他」分类（清单里得有 other 这一项）
              value: other
            - label: 不打分类
              value: drop
          validation: required
          help: 正常不会发生（提示词里已限定只能从清单里选）；这是兜底：模型偶尔会自作主张给一个清单外的标签。
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: autoTagEnabled
          label: 自动按关键词打标签
          value: true
          onValue: true
          offValue: false
          help: 开启后，把一轮日报里反复出现的关键词建成站点标签（门槛见下一项）。关闭则只保留下面手填的固定标签。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: autoTagMinCount
          label: 标签关键词出现次数门槛
          value: 2
          min: 1
          help: 一轮里至少有几篇文章提到这个词，才为它建标签。<b>默认 2</b>：一轮产出 5 篇、每篇 2-4 个关键词，若全都建成标签，一次运行就能造出十几个只出现一次的标签，标签墙很快就没法看了。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: postCategories
          label: 额外附加分类（可选）
          value: ""
          help: 填 Halo 已有的分类名（显示名或别名），多个用逗号分隔。匹配不到的会被忽略——手填项不自动创建，避免笔误造出一堆分类。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: postTags
          label: 额外附加标签（可选）
          value: ""
          help: 填 Halo 已有的标签名（显示名或别名），多个用逗号分隔。匹配不到的会被忽略。
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: mermaidEnabled
          label: 输出 Mermaid 图表
          value: true
          onValue: true
          offValue: false
          help: 开启后「数据概览」包含分类饼图与关键词柱状图（博客主题原生渲染）。若主题不支持 Mermaid，关闭后会退化为纯文本图。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: footerNote
          label: 文末署名
          value: ""
          help: 追加在文章末尾的斜体署名行；留空则不输出任何署名（默认留空）。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: publishWaitSeconds
          label: 发布确认最长等待（秒）
          value: 600
          min: 60
          max: 3600
          help: 发布走异步接口后，插件会轮询确认服务端是否已生成发布快照。日报正文较长时给足等待时间，默认 600 秒；超过仍未确认会记录为待发布，可在后台点「重新发布」。
