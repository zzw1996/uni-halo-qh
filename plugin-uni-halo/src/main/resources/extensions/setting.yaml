apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-uni-halo-settings
spec:
  forms:
    - group: basicConfig
      label: 基本配置
      formSchema:
        - $formkit: group
          name: tokenConfig
          label: Token配置
          help: 说明：配置小程序需要用到的token。
          value:
            personalToken: ""
          children:
            - $el: div
              attrs:
                class: "formkit-help text-xs mt-2 text-gray-500 flex items-center mb-1 cursor-pointer"
              innerHTML: "个人令牌：用于请求，发布瞬间，图库等操作（systemToken），参考 Token配置 。"
            - $formkit: textarea
              name: personalToken
              label: 个人令牌
              value: ""
              validation: required
        - $formkit: radio
          name: auditModeEnabled
          id: auditModeEnabled
          label: 是否开启审核模式
          help: 开启审核模式，关闭小程序部分数据展示，小程序提交审核使建议开启，审核后关闭。
          value: false
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
          validation: required
        - $formkit: text
          if: "$get(auditModeEnabled).value === true"
          name: auditModeMockUrl
          label: 模拟数据地址
          value: ""
          validation: required
          help: "填写模拟数据的url地址，参考数据格式和说明：https://uni-halo.925i.cn/deploy/wx-release.html"
        - $formkit: group
          name: copyrightConfig
          label: 页面版权配置
          value:
            enabled: true
            content: "「 2022 uni-halo 丨 开源项目@小莫唐尼 」"
          help: 说明：是否显示页面底部的版权信息（uni-halo 版权），只在【关于】页面中。
          children:
            - $formkit: select
              name: enabled
              id: copyrightEnabled
              label: 显示版权信息
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              validation: required
            - $formkit: text
              if: "$get(copyrightEnabled).value === true"
              name: content
              label: 版权内容
              value: ""
              validation: required
        - $formkit: group
          name: postDetailConfig
          label: 文章详情页配置
          value:
            showComment: true
            copyrightEnabled: true
            copyrightAuthor: "uni-halo"
            copyrightDesc: "使用《非商业性使用-相同方式共享 4.0 国际 (CC BY-NC-SA 4.0)》协议授权，文章来源于网上收集或者原创，若未在文章内说明的均为原创文章"
            copyrightViolation: "若侵害到您的权利，请您及时联系我，在收到通知后第一时间处理，邮箱：xxxx@xx.com"
          children:
            - $formkit: select
              name: showComment
              label: 是否显示评论相关
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              validation: required
              help: 说明：直接关闭评论区（不显示数据）和评论按钮，优先级高于系统设置的评论开关。
            - $formkit: select
              name: copyrightEnabled
              id: postDetailCopyrightEnabled
              label: 是否使用文章版权
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              validation: required
              help: 说明：文章详情页面中，显示关于文章版权相关的说明信息。
            - $formkit: text
              if: "$get(postDetailCopyrightEnabled).value === true"
              name: copyrightAuthor
              label: 文章版权作者
              value: ""
              validation: required
            - $formkit: text
              if: "$get(postDetailCopyrightEnabled).value === true"
              name: copyrightDesc
              label: 文章版权描述
              value: ""
              validation: required
            - $formkit: text
              if: "$get(postDetailCopyrightEnabled).value === true"
              name: copyrightViolation
              label: 文章侵权说明
              value: ""
              validation: required
        - $formkit: select
          name: showAboutSystem
          label: 显示关于项目页面
          value: true
          options:
            - label: 是
              value: true
            - label: 否
              value: false
          validation: required
          help: 说明：该页面入口在【关于】导航页面的【关于项目】入口，主要用于介绍该开源项目。
        - $formkit: group
          name: disclaimers
          label: 免责声明
          value:
            enabled: true
            content: ""
          children:
            - $formkit: select
              name: enabled
              id: disclaimersEnabled
              label: 是否启用
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              validation: required
            - $formkit: code
              name: content
              label: 声明内容
              value: ""
              language: html
              height: 200px
              help: 免责声明页面内容，不填写的话使用默认模板，支持 html 语法。
        - $formkit: group
          name: notifyConfig
          label: 活动公告弹窗
          value:
            enabled: false
            title: ""
            content: ""
            url: ""
          help: 开启后首页启动时弹出一次公告（每天最多弹一次）；可用于活动预告、新功能上线通知。
          children:
            - $formkit: switch
              name: enabled
              label: 开启公告弹窗
              value: false
              onValue: true
              offValue: false
            - $formkit: text
              name: title
              label: 公告标题
              value: ""
              validation: required
            - $formkit: textarea
              name: content
              label: 公告内容
              value: ""
              help: 支持 Markdown 语法。
            - $formkit: text
              name: url
              label: 跳转链接（可选）
              value: ""
              help: 填写后弹窗底部显示「点击跳转内容链接」按钮（以网页形式打开）。
    - group: redisConfig
      label: 验证码 Redis 配置
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "Halo Pro 2.16+ 可在主程序启用 Redis，但插件隔离上下文通常无法注入 RedisConnectionFactory。社区版或未注入 Bean 时，请在此配置插件独立 Redis；也可选内存模式（仅单节点开发）。"
        - $formkit: select
          name: storageMode
          label: 验证码存储方式
          value: auto
          options:
            - label: 自动（Halo Redis → 插件 Redis → 内存）
              value: auto
            - label: 仅 Halo 内置 Redis
              value: halo
            - label: 插件独立 Redis
              value: plugin-redis
            - label: 内存（重启失效，仅单节点）
              value: memory
          validation: required
        - $formkit: group
          name: pluginRedis
          label: 插件 Redis 连接
          value:
            enabled: false
            host: ""
            port: 6379
            database: 0
            password: ""
            username: ""
          help: storageMode 为 plugin-redis 时必填；auto 模式下填写后可作为 Halo Redis 不可用时的回退。
          children:
            - $formkit: select
              name: enabled
              id: pluginRedisEnabled
              label: 启用插件 Redis
              value: false
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
            - $formkit: text
              if: "$get(pluginRedisEnabled).value === true"
              name: host
              label: Redis 地址
              value: ""
              help: 例如 redis 或 127.0.0.1
            - $formkit: number
              if: "$get(pluginRedisEnabled).value === true"
              name: port
              label: 端口
              value: 6379
              min: 1
              max: 65535
            - $formkit: number
              if: "$get(pluginRedisEnabled).value === true"
              name: database
              label: 数据库
              value: 0
              min: 0
            - $formkit: text
              if: "$get(pluginRedisEnabled).value === true"
              name: username
              label: 用户名（可选）
              value: ""
            - $formkit: password
              if: "$get(pluginRedisEnabled).value === true"
              name: password
              label: 密码（可选）
              value: ""
    - group: appConfig
      label: 应用配置
      formSchema:
        - $formkit: group
          name: appInfo
          label: 应用信息
          value:
            name: "uni-halo v2.0"
            logo: "https://uni-halo.925i.cn/uni_halo/uni_halo_logo.png"
            qrCodeImageUrl: "https://uni-halo.925i.cn/uni_halo/uni_halo_qq_qrcode.png"
          children:
            - $formkit: text
              name: name
              label: 应用名称
              value: "uni-halo v2.0"
              validation: required
            - $formkit: attachment
              name: logo
              label: 应用图标
              value: "https://uni-halo.925i.cn/uni_halo/uni_halo_logo.png"
              validation: required
            - $formkit: radio
              id: useDynamicQRCode
              name: useDynamicQRCode
              label: 是否启用动态小程序码
              value: false
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              help: 启用后，生成的海报将显示动态的小程序码，实现扫描海报跳转文章详情页。
            - $formkit: text
              if: "$get(useDynamicQRCode).value === true"
              name: appId
              key: appId
              label: 小程序APP_ID
              value: ""
              validation: required
              help: 小程序的APP_ID，到微信公众平台获取
            - $formkit: text
              if: "$get(useDynamicQRCode).value === true"
              name: appSecret
              key: appSecret
              label: 小程序APP_SECRET
              value: ""
              validation: required
              help: 小程序的APP_SECRET，到微信公众平台获取
            - $formkit: attachmentPolicySelect
              if: "$get(useDynamicQRCode).value === true"
              name: policyName
              key: policyName
              label: 存储策略
              help: 存储策略
              value: "default-policy"
              validation: required
            - $formkit: attachmentGroupSelect
              if: "$get(useDynamicQRCode).value === true"
              name: fileGroupName
              key: fileGroupName
              label: 附件分组
              help: 附件分组
              value: ""
            - $formkit: attachment
              if: "$get(useDynamicQRCode).value === false"
              name: qrCodeImageUrl
              key: qrCodeImageUrl
              label: 小程序码图片
              value: "https://uni-halo.925i.cn/uni_halo/uni_halo_qq_qrcode.png"
              validation: required
              help: 微信小程序二维码的图片地址，用于海报生成
        - $formkit: group
          name: startConfig
          label: 启动页配置
          value:
            enabled: true
            alwaysShow: true
            title: "uni-halo 2.0"
            titleStyle: "color:#ffffff;"
            bg: "bg-gradient-blue-lighten-b"
            bgImage: ""
            bgVideo: ""
            backgroundType: "color"
            logo: "https://uni-halo.925i.cn/uni_halo/uni_halo_logo.png"
            desc1: "新触动 新感受 新体验"
            desc2: "准备好了吗，即刻就出发"
            descStyle: "color:#ffffff;"
            btnText: "立即体验"
            btnClass: ""
            btnStyle: ""
            useWave: true
          children:
            - $formkit: select
              name: enabled
              id: startConfigEnabled
              label: 开启启动页面
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              help: 使用启动页面后，用户访问应用时将优先显示启动页面
            - $formkit: select
              if: "$get(startConfigEnabled).value === true"
              name: alwaysShow
              label: 启动显示频率
              value: true
              options:
                - label: 每次显示
                  value: true
                - label: 显示一次
                  value: false
              help: 是否每次打开应用时都显示启动页面
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: title
              label: 启动标题
              value: "uni-halo 2.0"
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: titleStyle
              label: 标题样式
              value: "color:#ffffff;"
              help: 用于自定义样式，标准的css样式写法
            - $formkit: select
              if: "$get(startConfigEnabled).value === true"
              name: backgroundType
              id: backgroundTypeId
              label: 背景类型
              value: "color"
              options:
                - label: 颜色
                  value: "color"
                - label: 视频
                  value: "video"
                - label: 图片
                  value: "image"
              help: 使用视频背景后，启动页面将显示视频背景，视频背景的宽高比推荐为 9:16
            - $formkit: text
              if: "$get(startConfigEnabled).value === true && $get(backgroundTypeId).value === 'color'"
              key: bg
              name: bg
              label: 背景颜色类名
              value: "bg-gradient-blue-lighten-b"
              help: 背景颜色类名（仅支持组件内部样式类），用于自定义背景颜色
            - $formkit: attachment
              if: "$get(startConfigEnabled).value === true && $get(backgroundTypeId).value === 'image'"
              key: bgImage
              name: bgImage
              label: 背景图片地址
              value: ""
              help: 背景图片地址，支持网络图片地址
            - $formkit: select
              if: "$get(startConfigEnabled).value === true && $get(backgroundTypeId).value === 'image'"
              key: bgImageFit
              name: bgImageFit
              label: 图片裁剪模式
              value: "cover"
              options:
                - label: 100%
                  value: "100% 100%"
                - label: fill
                  value: "initial"
                - label: cover
                  value: "cover"
                - label: contain
                  value: "contain"
            - $formkit: attachment
              if: "$get(startConfigEnabled).value === true && $get(backgroundTypeId).value === 'video'"
              key: bgVideo
              name: bgVideo
              label: 背景视频地址
              value: ""
              help: 背景视频地址，支持网络图片地址，宽高比推荐为 9:16
            - $formkit: select
              if: "$get(startConfigEnabled).value === true && $get(backgroundTypeId).value === 'video'"
              key: bgVideoFit
              name: bgVideoFit
              label: 视频裁剪模式
              value: "cover"
              options:
                - label: cover
                  value: "cover"
                - label: fill
                  value: "fill"
                - label: contain
                  value: "contain"
            - $formkit: attachment
              if: "$get(startConfigEnabled).value === true"
              name: logo
              label: 启动图标
              value: "https://uni-halo.925i.cn/uni_halo/uni_halo_logo.png"
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: desc1
              label: 文本1
              value: "新触动 新感受 新体验"
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: desc2
              label: 文本2
              value: "准备好了吗，即刻就出发"
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: descStyle
              label: 文本样式
              value: "color:#ffffff;"
              help: 用于自定义样式，标准的css样式写法
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              validation: required
              name: btnText
              label: 按钮文本
              value: "立即体验"
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: btnClass
              label: 按钮类名
              value: ""
              help: 按钮类名（仅支持组件内部样式类），用于自定义按钮样式
            - $formkit: text
              if: "$get(startConfigEnabled).value === true"
              name: btnStyle
              label: 按钮样式
              value: "color:#ffffff;"
              help: 用于自定义样式，标准的css样式写法
            - $formkit: select
              if: "$get(startConfigEnabled).value === true"
              name: useWave
              label: 启用波浪效果
              value: true
              options:
                - label: 是
                  value: true
                - label: 否
                  value: false
              help: 底部的波浪效果
          help: 配置项中，提到的内置 类样式 相关的内容，请查阅 https://uni-halo.925i.cn/ 相关文档
    - group: imagesConfig
      label: 图片配置
      formSchema:
        - $formkit: attachment
          name: defaultImageUrl
          label: 默认图片
          value: "https://api.7trees.cn/img"
          validation: required
          help: 默认图片，当图片加载失败或者无图的时候显示，支持静态图片和随机图api
        - $formkit: attachment
          name: defaultThumbnailUrl
          label: 文章默认封面
          value: "https://tenapi.cn/v2/acg"
          validation: required
          help: 文章默认封面图片，支持静态图片和随机图api
        - $formkit: attachment
          name: defaultStaticThumbnailUrl
          label: 文章默认静态封面
          value: ""
          validation: required
          help: 文章默认封面图片，只支持静态图片
        - $formkit: attachment
          name: defaultAvatarUrl
          label: 默认头像地址
          value: "https://api.qjqq.cn/api/MiYouShe"
          validation: required
          help: 默认头像地址，用于评论/文章作者无头像显示，支持静态图片和随机图api
        - $formkit: attachment
          name: loadingGifUrl
          label: 加载中的图片
          value: "https://uni-halo.925i.cn/uni_halo/uni_halo_img_lazyload.gif"
          validation: required
          help: 图片正在加载中的图片资源，请选择较小的gif图片
        - $formkit: attachment
          name: loadingErrUrl
          label: 加载失败图片
          value: "https://uni-halo.925i.cn/uni_halo/3gVrtNeEDFeuMK14Vtytb9ml73TZj3dX.gif"
          validation: required
          help: 图片资源加载失败后显示的图片，请选择较小的图片
        - $formkit: attachment
          name: loadingEmptyUrl
          label: 空图片
          value: ""
          help: 图片资源为空时显示的图片，请选择较小的图片
    - group: shareConfig
      label: 分享配置
      formSchema:
        - $formkit: text
          name: title
          label: 标题
          value: "uni-halo 2.0"
          validation: required
        - $formkit: text
          name: desc
          label: 描述
          value: "一款免费开源可多端编译的微信小程序博客应用。"
          validation: required
        - $formkit: attachment
          name: imageUrl
          label: 封面
          value: "https://uni-halo.925i.cn/logo.png"
          validation: required
        - $formkit: text
          name: path
          label: 页面路径
          value: "/pages/index/index"
          validation: required
          help: 页面路径，如：/pages/index/index（一般默认就行）
        - $formkit: text
          name: copyLink
          label: 复制链接
          value: "/pages/index/index"
          validation: required
          help: 复制链接，如：/pages/index/index（一般默认就行）
    - group: wxAppConfig
      label: 微信小程序
      formSchema:
        - $formkit: text
          name: appId
          label: 小程序 AppID
          value: ""
          help: 到微信公众平台获取小程序 AppID；若已在「应用配置」中填写，可与此处保持一致
        - $formkit: text
          name: appSecret
          label: 小程序 AppSecret
          value: ""
          help: 到微信公众平台获取小程序 AppSecret，仅保存在服务端
        - $formkit: select
          name: loginEnabled
          label: 是否开启登录
          value: true
          options:
            - label: 开启
              value: true
            - label: 关闭
              value: false
          validation: required
        - $formkit: number
          name: profileModifyLimit
          label: 资料修改次数上限
          value: 0
          min: 0
          help: 0 表示不限制；大于 0 时用户通过 updateProfile 修改资料的次数上限（首次登录完善资料不计入）
        - $formkit: switch
          name: haloBindEnabled
          label: 开启 Halo 账号关联
          value: false
          onValue: true
          offValue: false
          help: 开启后，小程序将展示 Halo 账号关联入口及登录后的绑定引导；关闭后隐藏相关功能
    - group: channelsConfig
      label: 视频号
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "开启后，小程序首页会展示一张视频号入口卡片，用户点击直接跳转到你的视频号主页。跳转用微信开放能力 wx.openChannelsUserProfile 实现，需基础库 2.21.2 及以上，且只能在微信小程序内生效；H5 / App 端会自动降级为「复制视频号 ID + 微信内搜索」的引导。"
        - $formkit: switch
          name: enabled
          id: channelsEnabled
          label: 开启首页视频号入口
          value: false
          onValue: true
          offValue: false
          help: 关闭时小程序首页不展示视频号卡片（其余配置保留，重新开启即可复用）。
        - $formkit: text
          if: "$get(channelsEnabled).value === true"
          name: finderUserName
          label: 视频号 ID（finderUserName）
          value: ""
          validation: required
          help: "形如 sphcqO59YEPCvoe，必须以 sph 开头。获取方式：微信 → 我 → 视频号 → 进入我的视频号 → 右上角「…」→ 点一下视频号名字进入资料页，等 1~2 秒即可看到视频号 ID；或登录「视频号助手」在首页查看。填错会导致点击后无法跳转。"
        - $formkit: text
          if: "$get(channelsEnabled).value === true"
          name: nickname
          label: 视频号名称
          value: ""
          validation: required
          help: 展示在卡片标题上，一般与视频号昵称保持一致，例如：小莫唐尼
        - $formkit: textarea
          if: "$get(channelsEnabled).value === true"
          name: desc
          label: 简介
          value: ""
          help: 一句话说明视频号里会更新什么内容，建议不超过 30 字，超出会在卡片上截断。
        - $formkit: attachment
          if: "$get(channelsEnabled).value === true"
          name: avatarUrl
          label: 视频号头像
          value: ""
          help: 建议正方形图片（视频号头像 / logo）。留空时卡片用名称首字做兜底头像。
        - $formkit: text
          name: buttonText
          label: 按钮文案
          value: "进入视频号"
          help: 卡片按钮上的文字，留空则用「进入视频号」。
        - $formkit: text
          name: tip
          label: 底部提示
          value: "微信内点开即可观看，关注不迷路"
          help: 卡片底部的一行小字，留空则不展示。
    - group: tabbarConfig
      label: 底部导航（TabBar）
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "小程序底部导航默认是「首页 / 分类 / 瞬间 / 榜单 / 我的」5 项，由微信原生渲染。微信原生底栏不支持运行时增删项，所以开启本组配置后，小程序会隐藏原生底栏并改用自绘底栏，这样就能按开关决定显示哪几项。显示数量限制在 3~5 项（微信原生底栏最多 5 项；最少 3 项是本站口径）：不足 3 项会按「分类 → 瞬间 → 榜单 → 图库 → 小店」补齐，超过 5 项会按相反顺序裁掉。首页与「我的」是固定项，不提供开关。关闭本组开关时行为与现在完全一致，可随时回退。"
        - $formkit: switch
          name: enabled
          id: tabbarEnabled
          label: 启用可配置底部导航
          value: false
          onValue: true
          offValue: false
          help: 关闭（默认）= 沿用微信原生底栏，本次配置全部不生效。
        - $formkit: switch
          if: "$get(tabbarEnabled).value === true"
          name: showCategory
          label: 显示「分类」
          value: true
          onValue: true
          offValue: false
        - $formkit: switch
          if: "$get(tabbarEnabled).value === true"
          name: showMoments
          label: 显示「瞬间」
          value: true
          onValue: true
          offValue: false
        - $formkit: switch
          if: "$get(tabbarEnabled).value === true"
          name: showRank
          label: 显示「榜单」
          value: true
          onValue: true
          offValue: false
        - $formkit: switch
          if: "$get(tabbarEnabled).value === true"
          name: showGallery
          label: 显示「图库」
          value: true
          onValue: true
          offValue: false
          help: 图库页此前没有任何入口，开启后才会出现在底部导航里。
        - $formkit: switch
          if: "$get(tabbarEnabled).value === true"
          name: showStore
          label: 显示「微信小店」
          value: false
          onValue: true
          offValue: false
          help: 开启后底部出现「小店」入口，点进去是内嵌的微信小店主页（可直接下单）。微信小店未开通时会展示开通指引页，详细配置见下方。
        - $formkit: group
          name: store
          label: 微信小店
          value:
            appId: ""
            name: ""
            desc: ""
            coverUrl: ""
            qrCodeUrl: ""
            guideUrl: ""
          help: 用微信官方「店铺卡」组件把微信小店主页嵌进小程序，用户无需跳转即可浏览商品与下单。需要基础库 3.5.5 及以上（低版本微信会降级为引导页），且不支持微信 Windows / Mac 版。
          children:
            - $formkit: text
              name: appId
              label: 微信小店ID
              value: ""
              help: "获取方式：微信小店后台 → 店铺管理 → 基础信息 → 账号信息 → 微信小店ID（形如 wx 开头）。填错或未开通时，小店页会展示开通指引。"
            - $formkit: text
              name: name
              label: 小店名称
              value: ""
              help: 底栏文案固定为「小店」，这里填的名称用于小店页标题与降级页展示。
            - $formkit: textarea
              name: desc
              label: 小店简介
              value: ""
              help: 降级页（微信版本过低 / 非微信端）展示的一句话说明。
            - $formkit: attachment
              name: coverUrl
              label: 小店封面 / 店铺卡图片
              value: ""
              help: 降级页展示，建议正方形或 16:9 图片。
            - $formkit: attachment
              name: qrCodeUrl
              label: 小店二维码 / 小程序码
              value: ""
              help: 降级页展示，方便用户扫码进店。
            - $formkit: text
              name: guideUrl
              label: 开通指引链接
              value: ""
              help: 可选。填了之后开通指引页会多一个「查看开通指引」按钮并打开该链接（H5 页面），留空则只展示内置的步骤文案。
    - group: userPublishConfig
      label: 用户投稿（积分兑换发布）
      formSchema:
        - $formkit: switch
          name: enabled
          label: 开启用户投稿
          value: false
          onValue: true
          offValue: false
          help: 开启后用户可用积分投稿文章、发布瞬间；关闭时后端一律拒绝（前端入口也随之隐藏）。发布走服务端，扣分与发布在同一请求内完成：先写幂等流水并扣分，发布失败会自动退还积分。
        - $formkit: switch
          name: showButton
          label: 显示发布入口
          value: true
          onValue: true
          offValue: false
          help: 总开关之外再加一层展示控制：关闭后小程序端不显示任何投稿入口（接口仍可被调用，但受 enabled 与积分门槛约束）。
        - $formkit: number
          name: minPointsToShow
          label: 显示门槛（积分达到该值才显示按钮，0=不限制）
          value: 0
          min: 0
          help: 只影响按钮是否显示，不消耗积分。未达标时小程序会提示「还差 X 积分」。注意门槛与发布价是两个独立概念：门槛决定「能不能看见入口」，发布价决定「发一次扣多少」。
        - $formkit: number
          name: articleCost
          label: 投稿文章消耗积分
          value: 50
          min: 0
        - $formkit: number
          name: momentCost
          label: 发布瞬间消耗积分
          value: 20
          min: 0
        - $formkit: select
          name: defaultRoleMode
          label: 未登记角色的默认发布方式
          value: draft
          options:
            - value: draft
              label: 待审（推荐，安全优先）
            - value: direct
              label: 直接发布
            - value: deny
              label: 不允许发布
          help: 角色未出现在下方策略表时的兜底。默认「待审」：站长新加的自定义角色不会因为没登记而被当成可信角色直接发布。
        - $formkit: repeater
          name: rolePolicies
          label: 按 Halo 角色控制发布方式
          value:
            - role: guest
              mode: deny
            - role: contributor
              mode: draft
            - role: author
              mode: direct
            - role: editor
              mode: direct
            - role: admin
              mode: direct
            - role: super-role
              mode: direct
          help: 命中哪个角色就用哪个角色的方式（一个用户有多个角色时按表内顺序取第一个命中的）。<b>direct=直接发布</b>（文章立即公开、瞬间立即可见）；<b>draft=待审</b>（文章落 Halo 草稿，站长在 Halo 后台「文章→草稿」审后发布；瞬间以 approved=false 提交，站长在瞬间管理里通过后才公开）；<b>deny=不允许</b>。内置角色标识：guest（访客）/ contributor（投稿者）/ author（作者）/ editor（编辑）/ admin（管理员）/ super-role（超级管理员）。默认的「投稿者走待审、其余直接发、访客不允许」即由此表决定，可随时改。
          children:
            - $formkit: text
              name: role
              label: Halo 角色标识（如 contributor、author；留空则忽略该行）
              value: ""
            - $formkit: select
              name: mode
              label: 发布方式
              value: draft
              options:
                - value: direct
                  label: 直接发布
                - value: draft
                  label: 待审
                - value: deny
                  label: 不允许
        - $formkit: switch
          name: requireHaloBind
          label: 必须关联 Halo 账号才能投稿
          value: true
          onValue: true
          offValue: false
          help: 关闭后未关联 Halo 账号的用户也不能发布（没有 Halo 用户就没有作者身份），此项只影响错误提示文案，建议保持开启。
        - $formkit: switch
          name: contentSecurityEnabled
          label: 开启微信内容安全检测
          value: true
          onValue: true
          offValue: false
          help: 对投稿文本调用微信 msgSecCheck（图片检测未接入）。违规内容直接拒绝发布；检测接口本身不可用（网络/令牌问题）时放行并在日志告警，避免微信侧抖动把发布链路卡死。
        - $formkit: number
          name: dailyArticleLimit
          label: 每人每日投稿文章上限（0=不限）
          value: 3
          min: 0
        - $formkit: number
          name: dailyMomentLimit
          label: 每人每日发布瞬间上限（0=不限）
          value: 5
          min: 0
        - $formkit: number
          name: maxArticleTitleLength
          label: 文章标题字数上限
          value: 60
          min: 1
        - $formkit: number
          name: maxArticleContentLength
          label: 文章正文字数上限
          value: 5000
          min: 100
        - $formkit: number
          name: maxMomentLength
          label: 瞬间文字字数上限
          value: 500
          min: 1
        - $formkit: number
          name: maxMomentImages
          label: 瞬间图片张数上限
          value: 9
          min: 0
    - group: pointsConfig
      label: 积分系统
      formSchema:
        - $formkit: switch
          name: enabled
          label: 开启积分系统
          value: false
          onValue: true
          offValue: false
          help: 开启后，小程序用户可通过浏览、评论、点赞、签到等行为获得积分
        - $formkit: switch
          name: showInProfile
          label: 在个人中心展示
          value: true
          onValue: true
          offValue: false
          help: 关闭后「我的」页面不展示积分卡片（接口仍可用）
        - $formkit: number
          name: minBrowseDuration
          label: 浏览计分最短停留（秒）
          value: 5
          min: 1
          help: 前端文章详情页停留达到该秒数后才请求浏览积分
        - $formkit: group
          name: rules
          label: 积分规则
          value:
            browse:
              points: 1
              dailyMaxCount: 10
              dailyMaxPoints: 10
            comment:
              points: 5
              dailyMaxCount: 5
              dailyMaxPoints: 25
            upvote:
              points: 2
              dailyMaxCount: 20
              dailyMaxPoints: 40
            vote:
              points: 10
              dailyMaxCount: 10
              dailyMaxPoints: 100
            signIn:
              points: 10
              consecutiveBonus:
                - days: 3
                  bonus: 5
                - days: 7
                  bonus: 20
          children:
            - $formkit: group
              name: browse
              label: 浏览文章
              children:
                - $formkit: number
                  name: points
                  label: 单次积分
                  value: 1
                  min: 0
                - $formkit: number
                  name: dailyMaxCount
                  label: 每日最多次数
                  value: 10
                  min: 0
                  help: 0 表示不限制次数
                - $formkit: number
                  name: dailyMaxPoints
                  label: 每日积分上限
                  value: 10
                  min: 0
                  help: 0 表示不限制积分
            - $formkit: group
              name: comment
              label: 发表评论
              children:
                - $formkit: number
                  name: points
                  label: 单次积分
                  value: 5
                  min: 0
                - $formkit: number
                  name: dailyMaxCount
                  label: 每日最多次数
                  value: 5
                  min: 0
                - $formkit: number
                  name: dailyMaxPoints
                  label: 每日积分上限
                  value: 25
                  min: 0
            - $formkit: group
              name: upvote
              label: 点赞文章
              children:
                - $formkit: number
                  name: points
                  label: 单次积分
                  value: 2
                  min: 0
                - $formkit: number
                  name: dailyMaxCount
                  label: 每日最多次数
                  value: 20
                  min: 0
                - $formkit: number
                  name: dailyMaxPoints
                  label: 每日积分上限
                  value: 40
                  min: 0
            - $formkit: group
              name: vote
              label: 参与投票
              children:
                - $formkit: number
                  name: points
                  label: 单次积分
                  value: 10
                  min: 0
                - $formkit: number
                  name: dailyMaxCount
                  label: 每日最多次数
                  value: 10
                  min: 0
                - $formkit: number
                  name: dailyMaxPoints
                  label: 每日积分上限
                  value: 100
                  min: 0
            - $formkit: group
              name: signIn
              label: 每日签到
              children:
                - $formkit: number
                  name: points
                  label: 基础签到积分
                  value: 10
                  min: 0
                - $formkit: repeater
                  name: consecutiveBonus
                  label: 连续签到奖励
                  value:
                    - days: 3
                      bonus: 5
                    - days: 7
                      bonus: 20
                  help: 连续签到达到指定天数时额外奖励（取满足条件的最高档）
                  children:
                    - $formkit: number
                      name: days
                      label: 连续天数
                      value: 3
                      min: 2
                      validation: required
                    - $formkit: number
                      name: bonus
                      label: 额外奖励积分
                      value: 5
                      min: 1
                      validation: required
        - $formkit: group
          name: newUserGift
          label: 新用户见面礼
          value:
            points: 100
          help: 新用户首次登录自动到账的积分（每个用户永久限领一次）；填 0 表示关闭新人礼。
          children:
            - $formkit: number
              name: points
              label: 见面礼积分
              value: 100
              min: 0
              validation: required
        - $formkit: group
          name: draw
          label: 每日翻牌抽奖
          value:
            cost: 10
            prizes:
              - points: 2
                weight: 35
              - points: 5
                weight: 30
              - points: 10
                weight: 15
              - points: 20
                weight: 10
              - points: 50
                weight: 7
              - points: 100
                weight: 3
          help: 用户每天可抽一次，先扣「每次消耗积分」再中奖；奖池按权重随机。
          children:
            - $formkit: number
              name: cost
              label: 每次消耗积分
              value: 10
              min: 0
              validation: required
            - $formkit: repeater
              name: prizes
              label: 奖池（中奖积分 + 权重）
              children:
                - $formkit: number
                  name: points
                  label: 中奖积分
                  value: 2
                  min: 1
                  validation: required
                - $formkit: number
                  name: weight
                  label: 权重
                  value: 10
                  min: 1
                  validation: required
    - group: dailyTaskConfig
      label: 每日任务
      formSchema:
        - $formkit: switch
          name: enabled
          label: 开启每日任务
          value: true
          onValue: true
          offValue: false
          help: 开启后，小程序用户可在任务中心查看并领取每日任务奖励（需同时开启积分系统）
        - $formkit: repeater
          name: tasks
          label: 任务列表
          value:
            - type: sign_in
              target: 1
              points: 10
              enabled: true
            - type: browse
              target: 3
              points: 10
              enabled: true
            - type: comment
              target: 1
              points: 10
              enabled: true
            - type: upvote
              target: 3
              points: 8
              enabled: true
            - type: vote
              target: 1
              points: 10
              enabled: true
          help: 同一任务的进度按「当日该行为的积分记录条数」统计，每天每任务可领取一次奖励。注意：若某行为在积分规则中的单次积分为 0，该行为不产生记录，对应任务进度将统计不到。
          children:
            - $formkit: select
              name: type
              label: 任务类型
              value: browse
              options:
                - value: sign_in
                  label: 每日签到
                - value: browse
                  label: 浏览文章
                - value: comment
                  label: 发表评论
                - value: upvote
                  label: 点赞
                - value: vote
                  label: 参与投票
              validation: required
            - $formkit: number
              name: target
              label: 每日目标次数
              value: 3
              min: 1
              validation: required
            - $formkit: number
              name: points
              label: 奖励积分
              value: 10
              min: 0
              help: 可为 0（表示只送阅读券不送积分）。「奖励积分」与「奖励阅读券」至少填一个，两者都为 0 的任务不会下发。
            - $formkit: number
              name: tickets
              label: 奖励阅读券张数
              value: 0
              min: 0
              help: 完成该任务额外赠送的阅读券张数，填 0 表示不送券。这是比「签到送券」更可控的赠券方式——按完成次数结算，力度天然受限，建议优先用它把券送给真正活跃的用户。
            - $formkit: switch
              name: enabled
              label: 启用该任务
              value: true
              onValue: true
              offValue: false
    - group: mallConfig
      label: 积分商城
      formSchema:
        - $formkit: repeater
          name: exchangeItems
          label: 兑换权益（积分免费兑换）
          value:
            - key: dashboard_advanced
              name: 数据看板高级版
              points: 30
              dailyMaxCount: 1
              description: 解锁当日数据看板高级版（30 日趋势与数据摘要导出）
            - key: content_ticket
              name: 阅读券 x1
              points: 30
              dailyMaxCount: 1
              tickets: 1
              description: 兑换 1 张阅读券，用于解锁付费文章
          help: 积分仅限站内权益兑换；key 唯一，功能页按 key 判断是否已开通。每日可兑次数受 dailyMaxCount 限制。<br /><b>阅读券</b>：key 填 content_ticket 即成为「用积分换券」的入口（发放张数由本项的「每次发放阅读券张数」或「阅读券获取 → 积分兑换每次发放张数」决定）。<b>删掉这一项也不会让券失去入口</b>：只要「付费内容」是开启的，插件会自动补一条内置的阅读券兑换项，定价取「阅读券获取 → 积分兑换默认定价」。
          children:
            - $formkit: text
              name: key
              label: 权益 key（唯一，小写字母/数字/下划线）
              value: ""
              validation: required
            - $formkit: text
              name: name
              label: 权益名称
              value: ""
              validation: required
            - $formkit: number
              name: points
              label: 兑换消耗积分
              value: 30
              min: 1
              validation: required
            - $formkit: number
              name: dailyMaxCount
              label: 每日可兑换次数
              value: 1
              min: 1
              validation: required
            - $formkit: textarea
              name: description
              label: 权益说明（前端展示）
              value: ""
            - $formkit: number
              name: tickets
              label: 每次发放阅读券张数（仅 key=content_ticket 时有效）
              value: 1
              min: 1
              help: 仅当「权益 key」填 content_ticket 时生效。留空或填 0 时会回落到「阅读券获取 → 积分兑换每次发放张数」。
        - $formkit: switch
          name: luckyEnabled
          label: 开启幸运礼盒（抽奖）
          value: true
          onValue: true
          offValue: false
          help: 开启后积分兑换中心顶部展示抽奖卡；活动赠品性质，中奖由站长人工发放。
        - $formkit: number
          name: luckyCostPoints
          label: 每次抽奖消耗积分
          value: 20
          min: 1
          validation: required
        - $formkit: repeater
          name: luckyPrizes
          label: 奖品池（按权重随机）
          value:
            - name: "再来一次"
              emoji: "🎁"
              weight: 50
              needsAddress: false
              desc: "未中奖，再接再厉"
            - name: "定制周边小礼"
              emoji: "🎀"
              weight: 15
              needsAddress: true
              desc: "随机周边小件（帆布包/钥匙扣/贴纸等），中奖后填写收货信息"
            - name: "感谢参与"
              emoji: "🙏"
              weight: 35
              needsAddress: false
              desc: "未中奖，下次好运"
          help: 奖品在兑换中心「幸运礼盒」卡内展示（名称+说明），中奖用户可随时回填收货信息；中奖记录可在管理页查看：{站点地址}/apis/api.uni.uhalo.pro/v1alpha1/plugins/plugin-uni-halo/lucky-admin
          children:
            - $formkit: text
              name: name
              label: 奖品名称
              value: ""
              validation: required
            - $formkit: text
              name: emoji
              label: 图标（emoji）
              value: ""
              validation: required
            - $formkit: text
              name: desc
              label: 奖品说明（前端展示）
              value: ""
            - $formkit: number
              name: weight
              label: 权重
              value: 10
              min: 1
              validation: required
            - $formkit: switch
              name: needsAddress
              label: 中奖后需要填写收货信息
              value: false
              onValue: true
              offValue: false
              help: 开启后用户抽中将被引导填写收货人/电话/地址，中奖单在管理页可查。
    - group: levelConfig
      label: 等级与称号装扮
      formSchema:
        - $formkit: switch
          name: enabled
          label: 开启等级/称号/装扮
          value: true
          onValue: true
          offValue: false
          help: 开启后，小程序「身份中心」与「我的」页展示等级、称号；装扮需消耗积分兑换。
        - $formkit: repeater
          name: levels
          label: 等级表（按累计获得积分升级）
          value:
            - level: 1
              minPoints: 0
              title: 新手上路
            - level: 2
              minPoints: 100
              title: 初露锋芒
            - level: 3
              minPoints: 300
              title: 小有名气
            - level: 4
              minPoints: 600
              title: 活跃达人
            - level: 5
              minPoints: 1000
              title: 内容猎人
            - level: 6
              minPoints: 1600
              title: 资深玩家
            - level: 7
              minPoints: 2400
              title: 人气之星
            - level: 8
              minPoints: 3500
              title: 社区传奇
            - level: 9
              minPoints: 5000
              title: 积分大亨
            - level: 10
              minPoints: 7000
              title: 至尊VIP
          help: level 为展示序号，minPoints 为该级所需累计获得积分（取满足条件的最高级）。
          children:
            - $formkit: number
              name: level
              label: 等级（1 起）
              value: 1
              min: 1
              validation: required
            - $formkit: number
              name: minPoints
              label: 最低累计积分
              value: 0
              min: 0
              validation: required
            - $formkit: text
              name: title
              label: 等级名称
              value: ""
              validation: required
        - $formkit: repeater
          name: titles
          label: 称号（达标自动解锁，可佩戴展示）
          value:
            - id: read_100
              name: 百读不厌
              type: total_browse
              target: 100
              desc: 累计浏览 100 篇文章
            - id: sign_30
              name: 风雨无阻
              type: sign_in
              target: 30
              desc: 累计签到 30 天
            - id: vote_50
              name: 民意代表
              type: vote
              target: 50
              desc: 累计参与 50 次投票
            - id: comment_50
              name: 妙语连珠
              type: comment
              target: 50
              desc: 累计发表 50 条评论
            - id: invite_3
              name: 星火燎原
              type: invite
              target: 3
              desc: 邀请 3 位好友注册
            - id: points_5000
              name: 积分大亨
              type: total_points
              target: 5000
              desc: 累计获得 5000 积分
          children:
            - $formkit: text
              name: id
              label: 称号 ID（唯一，小写字母/数字/下划线）
              value: ""
              validation: required
            - $formkit: text
              name: name
              label: 称号名称
              value: ""
              validation: required
            - $formkit: select
              name: type
              label: 解锁条件类型
              value: total_browse
              options:
                - value: total_browse
                  label: 累计浏览篇数
                - value: sign_in
                  label: 累计签到天数
                - value: vote
                  label: 累计投票次数
                - value: comment
                  label: 累计评论条数
                - value: invite
                  label: 邀请注册人数
                - value: total_points
                  label: 累计获得积分
              validation: required
            - $formkit: number
              name: target
              label: 目标值
              value: 10
              min: 1
              validation: required
            - $formkit: text
              name: desc
              label: 达成说明（前端展示）
              value: ""
        - $formkit: repeater
          name: outfits
          label: 装扮商店（消耗积分兑换，0=永久）
          value:
            - key: avatar_gold
              name: 金色头像框
              type: avatar_frame
              points: 200
              durationDays: 0
              style: gold
            - key: avatar_rainbow
              name: 彩虹头像框
              type: avatar_frame
              points: 500
              durationDays: 0
              style: rainbow
            - key: nick_star
              name: 星光辉映
              type: nick_frame
              points: 100
              durationDays: 0
              style: "⭐"
            - key: nick_crown
              name: 王者之冠
              type: nick_frame
              points: 300
              durationDays: 0
              style: "👑"
            - key: theme_dusk
              name: 静谧蓝紫主题
              type: theme
              points: 150
              durationDays: 0
              style: primary
            - key: theme_sunset
              name: 落日橙主题
              type: theme
              points: 150
              durationDays: 0
              style: deep-orange
          help: key 唯一；type 为 avatar_frame（头像框）/nick_frame（昵称前缀）/theme（全局主题皮肤）。style 含义随 type 不同：头像框填样式名（gold/rainbow/silver，需与前端注册表一致）、昵称前缀直接填前缀文本（如 ⭐、👑，建议 2 个字符以内，超长会被前端忽略）、theme 填<b>皮肤包 id 或框架主题名</b>。<br /><b>皮肤包（推荐）</b>：paper（宣纸白，默认，不改变外观）/ mint（青瓷：冷调页底 + 青绿强调）/ sunrise（晨光：暖调页底 + 琥珀强调）/ ink（墨韵深色：深墨底 + 亮字 + 亮靛青，夜间护眼）。皮肤会同时更换页面底色、卡片、文字层级、分割线、强调色与渐变，是「整体换装」；深色皮肤连导航栏与 tabBar 一起变暗。<br /><b>框架主题名（兼容旧配置）</b>：light-blue/primary/blue/cyan/green/orange/deep-orange/blue-grey，只换强调色，页面底色与卡片不变——已购用户的旧装扮继续有效。填错会导致用户付费后界面无变化（身份中心会显示「未登记」提示）。durationDays 填 0 表示永久；大于 0 为限时，到期后自动失效、需重新购买，身份中心会显示剩余天数。
          children:
            - $formkit: text
              name: key
              label: 装扮 key（唯一，小写字母/数字/下划线）
              value: ""
              validation: required
            - $formkit: text
              name: name
              label: 装扮名称
              value: ""
              validation: required
            - $formkit: select
              name: type
              label: 装扮类型
              value: avatar_frame
              options:
                - value: avatar_frame
                  label: 头像框
                - value: nick_frame
                  label: 昵称前缀
                - value: theme
                  label: 主题色
              validation: required
            - $formkit: number
              name: points
              label: 兑换消耗积分
              value: 100
              min: 1
              validation: required
            - $formkit: number
              name: durationDays
              label: 有效天数（0=永久）
              value: 0
              min: 0
              validation: required
            - $formkit: text
              name: style
              label: 样式值（头像框 gold/rainbow/silver；昵称前缀填文本；主题填皮肤 id：paper/mint/sunrise/ink）
              value: ""
              help: 主题装扮填皮肤 id 会整站换装（页底/卡片/文字/分割线/强调色一起变）；也可填旧框架主题名只换强调色，两类取值都兼容。
            - $formkit: number
              name: minSpend
              label: 累计消费门槛（元，0=无门槛）
              value: 0
              min: 0
              help: 填 0 为普通装扮（谁都能用积分兑换）；大于 0 时该装扮变成「消费回馈限定款」——只有在本站累计消费达到该金额的用户才能兑换。这是消费里程碑的载体：用户为了凑门槛会主动多买，而限定装扮在评论区、榜单、我的页、身份中心都会展示，戴着它等于替站点做宣传。<br />注意单位为「元」，与「虚拟支付」里道具价格的「分」不同（填 30 就是消费满 30 元）。只统计已到账订单，待支付与需退款的不计。
    - group: inviteConfig
      label: 邀请奖励
      formSchema:
        - $formkit: switch
          name: enabled
          label: 开启邀请奖励
          value: true
          onValue: true
          offValue: false
          help: 开启后，用户可在「邀请好友」页生成邀请码，好友通过分享首次登录注册即视为邀请成功，邀请人获得奖励积分（同一被邀请人仅一次）。
        - $formkit: number
          name: rewardPoints
          label: 每邀请 1 人奖励积分（邀请人）
          value: 30
          min: 0
          validation: required
          help: 被邀请人注册后自动发放到邀请人账户；填 0 表示只给被邀请人发。
        - $formkit: number
          name: inviteeRewardPoints
          label: 被邀请人奖励积分
          value: 30
          min: 0
          validation: required
          help: 新用户通过邀请分享首次登录时，他自己也能拿到的积分（填 0 表示不发）。这一笔与「新人见面礼」相互独立，两者都会发。注意：奖励只挂在「新用户首次注册」这个动作上，不要写成「分享得积分」——微信运营规范禁止诱导分享。
    - group: payConfig
      label: 虚拟支付（权益直购）
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "微信虚拟支付（个人主体）仅支持「道具直购」：现金直接购买具体权益（发布券 / 阅读券 / 装扮），不支持充值积分、代币等流转功能。数据看板高级版已调整为纯积分兑换权益，不再作为付费道具售卖。开通前提：小程序主体为个人、服务类目含「工具」、已完成认证与备案，并在 MP 后台【支付与交易 - 虚拟支付】开通签约。限额与费率：月支付限额 10 万元；Android 技术服务费约 1%、iOS 苹果佣金约 12%。"
        - $formkit: switch
          name: enabled
          id: payEnabled
          label: 开启权益直购
          value: false
          onValue: true
          offValue: false
          help: 关闭时小程序不展示「权益直购」入口、接口也不下发商品。请确认 MP 后台虚拟支付已开通并完成签约后再开启。
        - $formkit: text
          if: "$get(payEnabled).value === true"
          name: offerId
          label: OfferID（虚拟支付商户号）
          value: ""
          validation: required
          help: MP 后台【虚拟支付 - 基本配置】中的 OfferID；未填写时用户下单会提示「虚拟支付 OfferID 未配置」。
        - $formkit: password
          if: "$get(payEnabled).value === true"
          name: appKey
          label: 现网 AppKey（支付密钥）
          value: ""
          validation: required
          help: MP 后台【虚拟支付 - 基本配置】中的现网 AppKey，用于服务端计算 paySig 签名。仅保存在服务端、不会下发到小程序；填错会导致支付报 -15006。
        - $formkit: number
          if: "$get(payEnabled).value === true"
          name: env
          label: 支付环境
          value: 0
          min: 0
          max: 1
          help: 0 = 正式环境（现网），1 = 沙箱环境。小程序正式版只能填 0，填 1 会报 -15011。
        - $formkit: number
          if: "$get(payEnabled).value === true"
          name: zoneId
          label: 分区 ID（zoneId）
          value: 1
          min: 1
          help: 道具直购（short_series_goods）当前不使用该参数，保留默认值 1 即可。
        - $formkit: repeater
          if: "$get(payEnabled).value === true"
          name: goods
          label: 权益道具（现金直购商品）
          value:
            - goodsId: ""
              name: 阅读券 x5
              price: 600
              type: content_ticket
              value: 5
              style: ""
          help: 每个道具需先在 MP 后台【虚拟支付 - 道具管理】创建并完成发布（发布后约 10 分钟生效，未发布会报 -15010 / -15014）。道具 ID 与价格必须与微信后台完全一致，价格不一致会报 -15013。个人主体不支持「积分充值」类道具，即使配置了也不会下发到小程序。数据看板高级版与发布券均已下架，不再作为付费道具售卖，配置 dashboard 或 publish_ticket 类型同样不会下发。<br /><b>装扮类商品（type=outfit）的展示位置</b>：不再出现在小程序的「权益直购」页，而是作为「我的 → 身份中心 → 装扮商店」中该装扮的<b>现金价</b>，与积分价并列展示，用户可自行选择用积分兑换或直接付款；因此 style 仍必须填写装扮的 key（详见下方说明）。订单与退款清单（需管理员令牌）：{站点地址}/apis/api.uni.uhalo.pro/v1alpha1/plugins/plugin-uni-halo/refund-admin —— 用户重复购买已拥有的装扮时，订单会停在「待退款」状态且不会自动重试，需按该页的微信平台单号人工退款。
          children:
            - $formkit: text
              name: goodsId
              label: 道具 ID（productId）
              value: ""
              validation: required
              help: 需与 MP 后台【道具管理】中创建的道具 ID 完全一致，下单时作为 productId 传给微信。
            - $formkit: text
              name: name
              label: 道具名称（前端展示）
              value: ""
              validation: required
            - $formkit: number
              name: price
              label: 单价（单位：分）
              value: 600
              min: 1
              validation: required
              help: 单位为「分」，全程不做换算，例如 6 元填 600。必须与 MP 后台道具价格一致，否则支付报 -15013。
            - $formkit: select
              name: type
              label: 道具类型
              value: content_ticket
              options:
                - value: content_ticket
                  label: 阅读券（解锁付费文章）
                - value: outfit
                  label: 装扮（在身份中心穿戴）
                - value: membership
                  label: 会员卡（单次购买的有效期权益）
                - value: bundle
                  label: 套餐（一条商品含多种权益）
              validation: required
              help: 仅限以上权益直购类型，不支持积分充值。数据看板高级版已改为纯积分兑换权益（见「积分商城」分组）；发布券已下架——普通用户当前不能发表瞬间（仅博主可发），该券没有消费点，卖出去用户也用不上，故不再作为付费道具售卖；类型非法或缺失的商品不会下发。<br /><b>membership</b>：需先在「会员卡」分组开启会员，道具数量填天数（会员期内付费文章免券）。<br /><b>bundle</b>：在下方「套餐子项」里配置包含的权益，子项会逐个发放；套餐里的装扮子项与单卖装扮走同一套校验（未登记或已拥有都会拒绝下单，避免付了套餐钱却产生退款纠纷）。
            - $formkit: number
              name: value
              label: 道具数量
              value: 1
              min: 1
              help: 阅读券 = 发放的券张数（如买 5 张填 5）；会员卡 = 会员天数；装扮保持 1 即可。某条商品配了「套餐子项」时会忽略本字段（以子项配置为准）。
            - $formkit: repeater
              name: items
              label: 套餐子项（仅类型为「套餐」时填写）
              value: []
              help: 仅当道具类型选「套餐」时生效。每个子项是一项权益，发货时按顺序逐个发放，各自独立幂等（中途失败重试不会重复发放已成功的子项）。<b>子项里的装扮必须填装扮 key</b>，且用户已拥有该装扮时会拒绝整单下单——避免用户付了套餐钱、装扮那部分变成退款纠纷。同一装扮在一份套餐里不要重复配置。注意：套餐子项不支持嵌套套餐，也不支持积分充值。
              children:
                - $formkit: select
                  name: type
                  label: 权益类型
                  value: content_ticket
                  options:
                    - value: content_ticket
                      label: 阅读券
                    - value: outfit
                      label: 装扮
                    - value: membership
                      label: 会员天数
                  validation: required
                - $formkit: number
                  name: value
                  label: 数量（券张数 / 会员天数）
                  value: 1
                  min: 1
                  help: 装扮子项固定为 1，填其他值会被忽略。
                - $formkit: text
                  name: style
                  label: 装扮 key（子项为装扮时必填）
                  value: ""
                  help: 填装扮商店里的 key（如 avatar_gold），不是样式值。
            - $formkit: number
              name: originalPrice
              label: 划线原价（单位：分，可留空）
              value: 0
              min: 0
              help: 仅用于促销展示（例如现价 600 分、原价 3000 分，界面显示「￥30.0 <s>￥6.0</s>」）。<b>不参与任何计算</b>：实际售价始终是上面的「单价」，必须与 MP 后台一致。原价必须高于现价，否则会被忽略（避免出现「现价 6 元、原价 5 元」这种明显错误）。请填真实的历史价格，虚构原价违反价格标示要求。
            - $formkit: datetime-local
              name: promoEndsAt
              label: 限时截止时间（可留空）
              value: ""
              help: 直接点选日期与时间即可（按你所在时区理解，无需换算时间戳）。填写后小程序会显示「限时特价」标记与倒计时，到期自动隐藏划线价与倒计时。<br /><b>留空 = 没有活动。</b>只填日期不填时间时按当天 23:59 截止。注意：这里只影响「划线原价 + 倒计时」的展示，<b>实际售价始终是上面的「单价」</b>——真的要调价，必须去 MP 后台改道具价格（微信侧优惠价最低只能到原价的 40%）。
            - $formkit: text
              name: style
              label: 装扮 key（类型为装扮时必填）
              value: ""
              help: 必须填写「等级与称号装扮 → 装扮商店」中对应装扮的 key（如 avatar_gold、nick_star、theme_dusk），不是样式值（如 gold、⭐）。该 key 决定这笔现金商品对应哪一枚装扮——用户在身份中心的装扮卡片上会看到「￥价格 购买」按钮。填错或缺失时该商品不会下发到小程序（插件日志会告警），用户点现金购买也会被拦下并提示配置错误——不会出现「付了钱拿不到」的情况。展示名称自动取装扮商店里的名称，此处填的名称不生效。

    - group: contentConfig
      label: 付费内容（阅读券）
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "用「阅读券」解锁付费文章。付费文章<b>不在本插件里维护清单</b>，而是在 Halo 后台给文章打上指定 slug 的标签（默认 paid）即可，站长无需重复配置。<br /><b>⚠️ 生效范围</b>：拦截点在文章详情 API，因此付费墙<b>只保护小程序端</b>；Halo 网页版主题通过 permalink 直接渲染内容、不走该 API，博客网站本身仍可阅读全文。若需网页端也付费，需另行改造主题或使用 Halo 原生「私有/内部」可见性。<br /><b>合规提示</b>：券可累积、可跨文章通用，语义上接近代币，个人主体下能否通过审核取决于审核判断，建议小额试探后再放量。"
        - $formkit: switch
          name: enabled
          id: contentEnabled
          label: 开启付费内容
          value: false
          help: 关闭时所有文章均可自由阅读，不会拦截任何请求。默认关闭，需显式开启。
        - $formkit: text
          name: paidTagSlug
          label: 付费标记标签 slug
          value: "paid"
          validation: required
          help: 文章只要带有该 slug 的标签即视为付费文章。请先在 Halo 后台【文章 - 标签】创建该标签（slug 需完全一致，区分大小写时以本插件按小写比较为准）。填了不存在的 slug 会导致付费功能静默失效——所有文章都不拦截，插件日志会输出告警。
        - $formkit: number
          name: costTickets
          label: 解锁消耗券张数
          value: 1
          min: 1
          help: 解锁一篇付费文章消耗的阅读券张数，至少为 1（填 0 或负数会被强制回落为 1，避免变成免费解锁）。
        - $formkit: switch
          name: freeForOwner
          label: 博主本人免费
          value: true
          help: 开启后，文章作者本人（微信用户已绑定的 Halo 账号与文章 owner 一致）阅读自己的付费文章时不拦截、不扣券。建议保持开启。
        - $formkit: switch
          name: permanent
          label: 解锁永久有效
          value: true
          help: 解锁记录永久保存，同一篇文章不会重复扣券。关闭暂不支持限时解锁，仅作语义占位，请勿关闭。
        - $formkit: switch
          name: freeForDigest
          label: AI 日报文章免券（建议保持开启）
          value: true
          help: 开启后，「AI 日报」自动生成的文章不需要阅读券即可阅读，无论它们带了什么标签。<br />为什么建议开启：日报是拉新与留存的入口——用户从分享、搜索进来，点开的第一篇往往就是日报文章；如果这里被付费墙拦住，新用户第一眼就被要求用券解锁，转化直接归零，而且这种拦截很难归因到配置上。确实希望日报也收费时再关掉此项。

    - group: ticketConfig
      label: 阅读券获取
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "阅读券（解锁付费文章）此前只有 <b>现金直购</b> 与 <b>积分兑换</b> 两条获取途径，用户从没体验过券能解锁什么就先撞上了付费墙，付费转化因此很低。本分组提供「<b>免费的第一次</b>」：让用户零成本拿到券、用掉一张、看到墙后面的内容，才会为下一篇付钱。<br /><b>力度建议</b>：赠券力度直接决定付费转化。签到天天送券会让日活用户永远不必付费；相反对照组是「新人送 1 张、首购再送 1 张、连签 7 天送 2 张」——用户先体验，再为下一篇买单。<br /><b>任务送券</b>在「每日任务」分组里按任务单独配置（字段 tickets），按完成次数结算，力度比签到更可控，建议优先用它。"
        - $formkit: number
          name: newUserTickets
          label: 新人见面礼赠送张数
          value: 1
          min: 0
          help: 微信用户首次登录领取新人礼时附带赠送的阅读券张数。填 0 表示不送。升级前已领过新人礼的老用户会在下次登录时补到这一次券。
        - $formkit: number
          name: firstPurchaseTickets
          label: 首单礼赠送张数
          value: 1
          min: 0
          help: 用户在本站的<b>第一笔</b>成功订单额外赠送的阅读券张数（任意道具类型都算）。「第一次付钱」的心理门槛远高于第二次，首单加送一张券等于让用户用同一笔钱拿到两篇内容。填 0 表示不送。
        - $formkit: number
          name: signInTickets
          label: 每日签到赠送张数
          value: 0
          min: 0
          help: 每次签到赠送的阅读券张数。<b>默认 0（关闭）</b>：解锁一篇付费文章只需 1 张券，天天签到送券等于让活跃用户完全不必付费，请确认经营策略后再开启。
        - $formkit: number
          name: streakDays
          label: 连签奖励门槛天数
          value: 7
          min: 0
          help: 连续签到达到该天数时额外赠券，之后按周期重复（连签 7/14/21 天各发一次，而不是只在第 7 天发一次——后者会让坚持到第 8 天的用户觉得奖励已经拿完了）。填 0 表示不启用连签奖励。
        - $formkit: number
          name: streakTickets
          label: 连签奖励张数
          value: 2
          min: 0
          help: 达到连签门槛时额外赠送的阅读券张数，与「每日签到赠送张数」叠加发放。
        - $formkit: number
          name: exchangeTickets
          label: 积分兑换每次发放张数
          value: 1
          min: 1
          help: 在「积分商城」用积分兑换阅读券时，每次兑换发放的张数，同时决定兑换项名称（如「阅读券 x2」）。至少为 1——填 0 会导致「扣了积分却不发券」。
        - $formkit: number
          name: exchangePoints
          label: 积分兑换默认定价
          value: 30
          min: 1
          help: 当「积分商城 → 兑换权益」里没有 content_ticket 这一项时，插件会自动补一条内置的阅读券兑换项并使用该定价。若你已在积分商城里手工配了 content_ticket，则以你的配置为准，本字段不生效。
    - group: memberConfig
      label: 会员卡
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "会员卡是「<b>单次购买的有效期权益</b>」：用户一次付款，获得一段固定期限的权益。<br /><b>合规说明</b>：微信虚拟支付的适用场景明确包含「会员订阅：VIP 会员、专属权益包」，道具直购（short_series_goods）的定义就是「会员、课程等单品，支持单次购买」，因此本形态与已在售的「限时装扮」结构一致，属于合规范围。<br /><b>⚠️ 本插件不提供自动续费订阅</b>（连续包月/包年）：那需要单独申请签约能力、《会员自动续费服务协议》报平台审核、缴纳交易保证金、提前 5 日提醒与预扣费通知，并走 submit_subscribe_pay_order 等专用接口，还有一整套用户感知规范（醒目展示下次扣款时间、协议须勾选且不得默认勾选）。如需自动续费请单独评估。<br /><b>销售方式</b>：会员卡作为「虚拟支付 → 权益道具」中的一条商品，类型选 membership，道具数量填天数。"
        - $formkit: switch
          name: enabled
          id: memberEnabled
          label: 开启会员卡
          value: false
          onValue: true
          offValue: false
          help: 关闭时接口不下发会员状态、也不允许发货 membership 类型的商品。请先配好会员商品与到期权益再开启。
        - $formkit: number
          name: defaultDays
          label: 默认会员周期（天）
          value: 30
          min: 1
          help: 商品未填「道具数量」时的兜底天数。填 0 会被强制回落为 30——否则用户付了钱却一刻钟会员都不是。
        - $formkit: switch
          name: freeContent
          label: 会员期内付费文章免券
          value: true
          onValue: true
          offValue: false
          help: 开启后，有效期内会员阅读全站付费文章不消耗阅读券（也不写入任何扣券流水）。这是会员卡的核心权益，关闭后会员只剩「开通赠券」这一个价值。
        - $formkit: number
          name: bonusTickets
          label: 开通/续费额外赠送阅读券
          value: 0
          min: 0
          help: 每次开通或续费成功额外赠送的阅读券张数，填 0 表示不送。用于促单，也可让用户即使不常看付费文章也能感受到会员的价值。
    - group: rankConfig
      label: 榜单
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "小程序「榜单」页由「文章榜（按浏览/点赞）」与「用户榜（累计积分 / 近 7 日活跃 / 邀请）」两部分组成，榜单对未登录用户同样可见。用户榜依赖积分系统，积分系统关闭时用户榜不展示。"
        - $formkit: switch
          name: enabled
          label: 开启榜单功能
          value: true
          onValue: true
          offValue: false
          help: 关闭后小程序「榜单」页不展示任何榜单数据（用户榜与互动动态接口同时停止下发，页面提示榜单未开启）。文章榜接口只返回公开的浏览量排行，不随该开关停用，但关闭后小程序端不会再请求它。
        - $formkit: switch
          name: showScore
          label: 公开榜单分值
          value: true
          onValue: true
          offValue: false
          help: 关闭后用户榜只显示名次、等级与称号，不显示具体积分与邀请人数（适用于不希望公开用户分值的站点）。
        - $formkit: switch
          name: enableInviteBoard
          label: 展示邀请榜
          value: true
          onValue: true
          offValue: false
          help: 邀请榜按成功邀请的人数排名，数据来自邀请关系；关闭后用户榜只剩「总积分 / 近 7 日」两个榜单。
        - $formkit: switch
          name: wallEnabled
          label: 展示互动动态
          value: true
          onValue: true
          offValue: false
          help: 展示最近用户的评论、点赞、投票动态（仅昵称、头像与内容标题，内容均为站点上已公开的信息）。浏览量不上墙。
        - $formkit: number
          name: wallLimit
          label: 互动动态条数
          value: 10
          min: 1
          max: 30
          help: 一次下发的动态条数，最大 30。
        - $formkit: switch
          name: wallIncludeUpvote
          label: 动态中包含「点赞」
          value: false
          onValue: true
          offValue: false
          help: 默认不包含：点赞是轻量动作，默认把「谁赞了哪篇」公开给其他访问者对用户偏侵扰。开启后动态会更活跃。评论与投票本就是公开行为，始终展示。
        - $formkit: switch
          name: weeklyRewardEnabled
          label: 开启周榜奖励
          value: false
          onValue: true
          offValue: false
          help: 开启后，每周一自动结算上一自然周（周一 00:00 ~ 周日 24:00）的活跃榜并发放积分，同一周同一用户只发一次。发放记录可在用户「积分明细」中查看（类型：榜单奖励）。默认关闭。
        - $formkit: number
          name: weeklyRewardTopN
          label: 奖励名次数量
          value: 3
          min: 1
          max: 10
          help: 只给活跃榜前 N 名发奖，最多 10 名。
        - $formkit: number
          name: weeklyRewardPoints
          label: 第 1 名奖励积分
          value: 60
          min: 0
          help: 第 1 名的积分奖励。填 0 或递减到 0 的名次不发放（该名次不产生流水）。
        - $formkit: number
          name: weeklyRewardStep
          label: 名次递减积分
          value: 20
          min: 0
          help: 每往后一名少发多少积分（第 2 名 = 第 1 名 - 递减值，依此类推），减到 0 为止。
    - group: aiDigestConfig
      label: AI 日报
      formSchema:
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "从 Karpathy 推荐的 92 个顶级技术博客抓取最新文章，用 AI 评分筛选后生成一份 Markdown 日报，并通过 Halo 官方接口上传头图、建稿并发布。每次运行需要约 1-3 分钟、若干次大模型调用，会产生 API 费用；定时执行依赖服务器对境外站点的出网能力。"
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "当前插件版本：<b>1.0.124</b>（若这里显示的不是该版本，说明运行中的 jar 还没更新）。独立管理页（不依赖控制台前端缓存，可直接打开操作）：<code>{site}/apis/api.uni.uhalo.pro/v1alpha1/plugins/plugin-uni-halo/ai-digest-admin</code>。控制台内页面位置：左侧菜单 <b>UniHalo → AI 日报</b>（在「邀请好友」下面）；若看不到该菜单项，请先在插件列表里重载插件并强制刷新浏览器（Ctrl+Shift+R）。"
        - $formkit: switch
          name: enabled
          id: aiDigestEnabled
          label: 开启 AI 日报
          value: false
          onValue: true
          offValue: false
          help: 关闭后定时任务与后台「立即生成」都不执行。默认关闭：日报会自动发布文章，需站长确认 AI Key 与发布参数后主动开启。
        - $formkit: switch
          name: scheduleEnabled
          if: "$get(aiDigestEnabled).value === true"
          label: 开启定时生成
          value: true
          onValue: true
          offValue: false
          help: 关闭后仍可在插件后台「AI 日报」页面手动生成。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: scheduleTimes
          label: 每天执行时刻
          value: "07:00"
          validation: required
          help: 24 小时制，格式 HH:mm，例如 07:00 表示每天凌晨 7 点执行。需要一天多次时用逗号分隔，例如 07:00,19:00。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: timezone
          label: 时区
          value: "Asia/Shanghai"
          validation: required
          help: 执行时刻按该时区计算，填错会退回 Asia/Shanghai。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: aiApiBase
          label: 主模型 API Base
          value: "https://api.deepseek.com/v1"
          validation: required
          help: 需要兼容 OpenAI 的 chat/completions 协议。DeepSeek 填 https://api.deepseek.com/v1，通义千问填 https://dashscope.aliyuncs.com/compatible-mode/v1。
        - $formkit: password
          if: "$get(aiDigestEnabled).value === true"
          name: aiApiKey
          label: 主模型 API Key
          value: ""
          validation: required
          help: 仅保存在服务端、不会下发到小程序。DeepSeek 可在 platform.deepseek.com 创建。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: aiModel
          label: 主模型名称
          value: "deepseek-chat"
          validation: required
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: fallbackApiBase
          label: 兜底 API Base（可选）
          value: ""
          help: 主模型调用失败时自动切换，留空则不启用兜底。同样需要兼容 OpenAI 协议。
        - $formkit: password
          if: "$get(aiDigestEnabled).value === true"
          name: fallbackApiKey
          label: 兜底 API Key（可选）
          value: ""
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: fallbackModel
          label: 兜底模型名称（可选）
          value: ""
          help: 留空时按兜底端点自动推断（含 deepseek 用 deepseek-chat，否则用 gpt-4o-mini）。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: hours
          label: 抓取时间范围（小时）
          value: 48
          min: 1
          max: 720
          validation: required
          help: 只保留该时间窗内发布的文章，48 小时通常刚好覆盖一个完整工作日。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: topN
          label: 精选篇数
          value: 15
          min: 1
          max: 50
          validation: required
          help: AI 评分后保留的篇数，10 篇偏精简、20 篇偏扩展。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: words
          label: 每篇目标字数
          value: 600
          min: 80
          max: 2000
          validation: required
          help: 概述 + 核心论点合计字数。实测 300-800 字能贴合目标，超过 1000 后模型会明显欠稿；想加长建议增加篇数而不是继续调高单篇字数。要发博客建议 600 以上。
        - $formkit: select
          if: "$get(aiDigestEnabled).value === true"
          name: language
          label: 摘要语言
          value: "zh"
          options:
            - label: 中文
              value: "zh"
            - label: English
              value: "en"
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: imageEnabled
          label: 抓取并上传文章头图
          value: true
          onValue: true
          offValue: false
          help: 头图取自 RSS 正文内嵌图片或文章页的 og:image，通过 Halo 官方附件接口上传到附件库后在正文中引用。实测约六成文章能配上图，抓不到的直接跳过。
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: requireImage
          label: 只发布带封面图的文章
          value: true
          onValue: true
          offValue: false
          help: 开启后，没配到头图（或头图上传失败）的文章会被过滤掉，由后续名次有图的文章补位；如果整轮都没配到图，本次运行会直接失败并说明原因，不会发出无图文章。关闭则允许发布无封面图的文章。
        - $formkit: attachmentPolicySelect
          if: "$get(aiDigestEnabled).value === true"
          name: attachmentPolicyName
          key: attachmentPolicyName
          label: 附件存储策略（可选）
          value: ""
          help: 留空则复用「应用配置」里的附件策略；那里也没有时使用默认策略 default-policy。用选择器而不是手填：策略名填错会让头图全部传不上去，而且从界面上看不出原因。
        - $formkit: attachmentGroupSelect
          if: "$get(aiDigestEnabled).value === true"
          name: attachmentGroupName
          key: attachmentGroupName
          label: 附件分组（可选）
          value: ""
          help: 留空则复用「应用配置」里的附件分组。
        - $formkit: select
          if: "$get(aiDigestEnabled).value === true"
          name: publishMode
          label: 发布方式
          value: "per-article"
          options:
            - label: 逐篇发布精选文章（每篇一篇独立文章）
              value: "per-article"
            - label: 合并为一篇 AI 日报
              value: "digest"
            - label: 两者都发
              value: "both"
          help: 默认「逐篇」：精选 N 篇就发 N 篇独立文章，每篇含中文标题、原文出处、头图、概述、核心论点与推荐理由。选「合并」则只发一篇含今日看点、数据概览与分类列表的日报；选「两者都发」会同时产出日报和每篇精选。任何模式都支持在后台「重新发布」，且逐篇模式下一篇失败不影响其它篇。
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: publishEnabled
          label: 生成后自动发布文章
          value: true
          onValue: true
          offValue: false
          help: 关闭后只生成日报并保存在后台，不发布文章（可随时在后台点「重新发布」）。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: haloBaseUrl
          label: Halo 接口地址（可选）
          value: ""
          help: 留空即用 http://127.0.0.1:服务端口（插件与 Halo 同进程，走本机回环）。若「后台能发文、插件发不了」，可在这里填站点地址（如 https://www.lxfzzw.com），让插件的请求与后台浏览器走完全一致的链路，以排除中间层差异。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: postOwner
          label: 文章作者
          value: "admin"
          validation: required
          help: Halo 用户名（不是昵称），默认 admin。填写的用户必须已存在，否则建稿会失败。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: postTitleTemplate
          label: 文章标题模板
          value: "AI 日报 · {date}"
          validation: required
          help: "{date} 会替换为日报日期（yyyy-MM-dd）；同时作为文章 slug 的来源。仅用于「合并为一篇 AI 日报」和「两者都发」模式——逐篇发布时每篇文章用各自的中文标题。" 
        - $el: div
          attrs:
            class: "formkit-help text-xs mt-2 text-gray-500 mb-2"
          innerHTML: "以下两项<b>通常不需要填</b>：文章的分类与标签由插件按 AI 判定结果自动落到站点分类/标签上，不存在会自动创建（创建出来的带 <code>uni.uhalo.pro/auto-generated</code> 标签，便于在 Halo 后台区分）。只有想给所有日报文章再钉一个固定分类/标签时才需要填。"
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: autoCategoryEnabled
          label: 自动按文章主题归类
          value: true
          onValue: true
          offValue: false
          help: 开启后，每篇文章按 AI 判定的主题（AI / ML、安全、工程、工具 / 开源、观点 / 杂谈、其他）自动归入对应的站点分类，分类不存在时自动创建。这样小程序端「按关注的分类看内容」才能生效——否则那些分类里永远没有文章。
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: autoTagEnabled
          label: 自动按关键词打标签
          value: true
          onValue: true
          offValue: false
          help: 开启后，把一轮日报里反复出现的关键词建成站点标签（门槛见下一项）。关闭则只保留下面手填的固定标签。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: autoTagMinCount
          label: 标签关键词出现次数门槛
          value: 2
          min: 1
          help: 一轮里至少有几篇文章提到这个词，才为它建标签。<b>默认 2</b>：一轮产出 5 篇、每篇 2-4 个关键词，若全都建成标签，一次运行就能造出十几个只出现一次的标签，标签墙很快就没法看了。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: postCategories
          label: 额外附加分类（可选）
          value: ""
          help: 填 Halo 已有的分类名（显示名或别名），多个用逗号分隔。匹配不到的会被忽略——手填项不自动创建，避免笔误造出一堆分类。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: postTags
          label: 额外附加标签（可选）
          value: ""
          help: 填 Halo 已有的标签名（显示名或别名），多个用逗号分隔。匹配不到的会被忽略。
        - $formkit: switch
          if: "$get(aiDigestEnabled).value === true"
          name: mermaidEnabled
          label: 输出 Mermaid 图表
          value: true
          onValue: true
          offValue: false
          help: 开启后「数据概览」包含分类饼图与关键词柱状图（博客主题原生渲染）。若主题不支持 Mermaid，关闭后会退化为纯文本图。
        - $formkit: text
          if: "$get(aiDigestEnabled).value === true"
          name: footerNote
          label: 文末署名
          value: ""
          help: 追加在文章末尾的斜体署名行；留空则不输出任何署名（默认留空）。
        - $formkit: number
          if: "$get(aiDigestEnabled).value === true"
          name: publishWaitSeconds
          label: 发布确认最长等待（秒）
          value: 600
          min: 60
          max: 3600
          help: 发布走异步接口后，插件会轮询确认服务端是否已生成发布快照。日报正文较长时给足等待时间，默认 600 秒；超过仍未确认会记录为待发布，可在后台点「重新发布」。
