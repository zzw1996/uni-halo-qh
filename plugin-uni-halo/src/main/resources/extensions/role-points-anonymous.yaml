apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-uni-halo-anonymous-role-points
  labels:
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
  annotations:
    rbac.authorization.halo.run/module: "UniHalo 积分"
    rbac.authorization.halo.run/display-name: "积分接口（UniHalo）"
rules:
  - apiGroups: [ "api.uni.uhalo.pro" ]
    resources: [ "plugins/points" ]
    verbs: [ "get", "list", "create" ]
