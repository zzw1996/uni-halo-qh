<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幸运礼盒 · 中奖记录管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #303133; padding: 20px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 6px; }
  .sub { color: #909399; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.04); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  input, select, button { font-size: 14px; border-radius: 8px; border: 1px solid #dcdfe6; padding: 8px 12px; outline: none; }
  input:focus, select:focus { border-color: #667eea; }
  button { background: #667eea; color: #fff; border: none; cursor: pointer; }
  button:hover { opacity: .9; }
  .token { width: 320px; }
  .tip { font-size: 12px; color: #b0b5c0; margin-top: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #f0f1f5; vertical-align: top; }
  th { color: #909399; font-weight: 600; white-space: nowrap; }
  td { word-break: break-all; }
  .tag { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; }
  .tag-pending { background: #fff3e0; color: #e8862b; }
  .tag-submitted { background: #e6f7e6; color: #3a9e3a; }
  .empty { color: #b0b5c0; text-align: center; padding: 40px 0; }
  .pager { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
  .emoji { font-size: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎁 幸运礼盒 · 中奖记录管理</h1>
  <p class="sub">凭 Personal Token 查看中奖单，按收货信息人工发货。Token 仅保存在本机浏览器。</p>

  <div class="card">
    <div class="row">
      <input class="token" id="token" type="password" placeholder="Personal Token（Halo 后台 → 个人资料 → 个人令牌）">
      <select id="status">
        <option value="">全部状态</option>
        <option value="pending">待填写收货信息</option>
        <option value="submitted">已提交待发货</option>
      </select>
      <input id="keyword" type="text" placeholder="搜索奖品/收货人/手机号/openid" style="width:260px">
      <button onclick="load(0)">查询</button>
    </div>
    <p class="tip" id="tip">提示：状态为「待填写」表示用户抽中但尚未填收货信息，可提醒；「已提交待发货」按地址发货。</p>
  </div>

  <div class="card">
    <div id="list"><div class="empty">请先输入 Personal Token 并点击查询</div></div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<script>
  var page = 0, size = 20;
  function token() { return document.getElementById('token').value.trim(); }
  function saveToken() {
    try { localStorage.setItem('luckyAdminToken', token()); } catch (e) {}
  }
  async function load(p) {
    page = p;
    saveToken();
    var t = token();
    if (!t) { document.getElementById('list').innerHTML = '<div class="empty">请先输入 Personal Token</div>'; return; }
    var status = document.getElementById('status').value;
    var keyword = document.getElementById('keyword').value.trim();
    var base = location.origin;
    var params = new URLSearchParams({ page: page, size: size });
    if (status) params.set('status', status);
    if (keyword) params.set('keyword', keyword);
    var url = base + '/apis/console.api.uni.uhalo.pro/v1alpha1/luckyWinnings?' + params.toString();
    try {
      var res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + t } });
      if (res.status === 401 || res.status === 403) {
        document.getElementById('list').innerHTML = '<div class="empty">鉴权失败：Token 无效或权限不足（需管理员令牌）</div>';
        return;
      }
      if (!res.ok) {
        document.getElementById('list').innerHTML = '<div class="empty">请求失败：HTTP ' + res.status + '</div>';
        return;
      }
      var data = await res.json();
      render(data);
    } catch (err) {
      document.getElementById('list').innerHTML = '<div class="empty">请求失败：' + (err && err.message || err) + '</div>';
    }
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function render(data) {
    var items = (data && data.items) || [];
    var html = '<table><thead><tr>' +
      '<th>奖品</th><th>用户</th><th>状态</th><th>收货人</th><th>电话</th><th>地址</th><th>中奖时间</th><th>提交时间</th>' +
      '</tr></thead><tbody>';
    if (!items.length) {
      html = '<div class="empty">暂无中奖记录</div>';
    } else {
      items.forEach(function (it) {
        var st = it.status === 'submitted'
          ? '<span class="tag tag-submitted">已提交待发货</span>'
          : '<span class="tag tag-pending">待填写收货信息</span>';
        html += '<tr>' +
          '<td><span class="emoji">' + esc(it.emoji || '🎁') + '</span> ' + esc(it.prizeName || '') + '</td>' +
          '<td>' + esc(it.nickname || '') + '<br><span style="color:#b0b5c0;font-size:12px">' + esc(it.wxOpenid || '') + '</span></td>' +
          '<td>' + st + '</td>' +
          '<td>' + esc(it.contactName || '-') + '</td>' +
          '<td>' + esc(it.phone || '-') + '</td>' +
          '<td>' + esc(it.address || '-') + '</td>' +
          '<td>' + esc(fmt(it.winTime)) + '</td>' +
          '<td>' + esc(fmt(it.submitTime)) + '</td>' +
          '</tr>';
      });
      html += '</tbody></table>';
    }
    document.getElementById('list').innerHTML = html;
    var total = (data && data.total) || 0;
    var pager = document.getElementById('pager');
    pager.innerHTML = total
      ? '<button onclick="load(0)" ' + (page === 0 ? 'disabled style="opacity:.5"' : '') + '>上一页</button>' +
        '<span style="font-size:13px;color:#909399">第 ' + (page + 1) + ' 页 · 共 ' + total + ' 条</span>' +
        '<button onclick="load(' + (page + 1) + ')">下一页</button>'
      : '';
  }
  function fmt(str) {
    if (!str) return '';
    var d = new Date(str);
    if (isNaN(d.getTime())) return str;
    var pad = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  (function () {
    try { var t = localStorage.getItem('luckyAdminToken'); if (t) { document.getElementById('token').value = t; } } catch (e) {}
  })();
</script>
</body>
</html>
